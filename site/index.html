  try { s = await season(sid); } catch (e) { $("#out", root).innerHTML = errorHTML(e); $("#month-panel", root).hidden = true; return; }
  const all = [];
  (s.events || []).forEach(e => (e.races || []).forEach(r => { if (r.StartTime) all.push({ r, e, d: new Date(r.StartTime) }); }));
  all.sort((a, b) => a.d - b.d);
  const noCal = !all.length;
  if (noCal) $("#month-panel", root).innerHTML = `<div class="pb"><div class="note">Le calendrier ${seasonLabel(sid)} n'est pas encore publié par l'IBU. Les saisons précédentes restent consultables plus bas.</div></div>`;

  const now = Date.now();
  const isPast = x => x.d.getTime() + 2 * 3600e3 < now;
  const inCat = x => f.g === "all" || raceCat(x.r) === f.g || raceCat(x.r) === "MX";
  const inDisc = x => !f.disc.length || f.disc.includes(fmtKey(x.r));
  const seasonItems = all.filter(inCat);
  const shown = all.filter(x => inCat(x) && inDisc(x));            // calendrier mensuel : passé compris
  const list = shown.filter(x => !f.hidePast || !isPast(x));        // liste
  const icsHref = r => "data/calendar/races/" + encodeURIComponent(r.RaceId) + ".ics";
  const status = x => isPast(x) ? `<a class="rstat done" href="#/course/${esc(x.r.RaceId)}">Résultats →</a>` : `<span class="rstat">À venir</span>`;
  const raceRow = x => `<div class="cal-race${isPast(x) ? " past" : ""}">
    <span class="t">${esc(x.d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }))}</span>
    <span class="n"><a href="#/course/${esc(x.r.RaceId)}">${esc(raceTitle(x.r))}</a><span class="gtag g-${raceCat(x.r)}">${esc(CAT_SHORT[raceCat(x.r)] || "")}</span></span>${status(x)}</div>`;

  /* Filtres d'épreuves */
  const discs = [...new Set([...all.map(x => fmtKey(x.r)), ...f.disc])].sort((a, b) => FMT_ORDER.indexOf(a) - FMT_ORDER.indexOf(b));
  $("#disc-chips", root).innerHTML = discs.map(d => `<button class="chip${f.disc.includes(d) ? " on" : ""}" data-d="${d}" aria-pressed="${f.disc.includes(d)}">${esc(FMT_FR[d] || d)}</button>`).join("")
    + (f.disc.length || f.g !== "all" ? `<button class="chip clear" id="clear-filters" type="button">Effacer les filtres ×</button>` : "");
  const clr = $("#clear-filters", root);
  if (clr) clr.addEventListener("click", () => { LS.set("cal", { ...f, g: "all", disc: [] }); render(); });
  root.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => {
    const d = b.dataset.d; const disc = f.disc.includes(d) ? f.disc.filter(x => x !== d) : [...f.disc, d]; LS.set("cal", { ...f, disc }); render(); }));

  /* Prochaine course */
  const nx = seasonItems.find(x => !isPast(x));
  if (nx) {
    const [big, small] = countdown(nx.d);
    $("#next", root).innerHTML = `<div class="next"><div class="when">${esc(big)}<small>${esc(small)}</small></div>
      <div class="what"><span>Prochaine course</span><b>${esc(raceTitle(nx.r))}</b><span>${esc(nx.e.ShortDescription || "")} · ${esc(fmtDateTime(nx.r.StartTime))}</span></div></div>`;
  }

  /* Calendrier mensuel */
  const months = [...new Set(all.map(x => ym(x.d)))].sort();
  const byDay = new Map(); shown.forEach(x => { const k = ymd(x.d); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(x); });
  const firstDayOfEvent = new Map(); all.forEach(x => { const k = ymd(new Date(x.e.StartDate)); const first = ymd(x.d);
    if (!firstDayOfEvent.has(x.e.EventId) || first < firstDayOfEvent.get(x.e.EventId)) firstDayOfEvent.set(x.e.EventId, first); });
  const eventStartsOn = new Map(); firstDayOfEvent.forEach((k, eid) => { const e = all.find(x => x.e.EventId === eid).e; eventStartsOn.set(k, e); });
  const saved = LS.get("calMonth", null);
  const todayYm = ym(new Date());
  let month = months.includes(saved) ? saved : nx && months.includes(ym(nx.d)) ? ym(nx.d) : months.includes(todayYm) ? todayYm : months[0];
  let selected = null;
  const todayK = ymd(new Date());
  const WEEK = ["lun.", "mar.", "mer.", "jeu.", "ven.", "sam.", "dim."];
  const dayDetail = k => {
    const items = byDay.get(k) || [];
    const d = new Date(k + "T12:00:00");
    const ev = items[0] && items[0].e;
    return `<div class="dd-head"><b>${esc(d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }))}</b>${ev ? ` <span class="muted">· ${esc(ev.ShortDescription || "")}</span> ${natHTML(ev.Nat)}${eventKind(ev.EventId) !== "Coupe du monde" ? ` <span class="tag live">${esc(eventKind(ev.EventId))}</span>` : ""}` : ""}</div>
      ${items.length ? `<div class="cal-races">${items.map(raceRow).join("")}</div>` : `<p class="muted small" style="margin:6px 0 0">Pas de course ce jour-là${f.disc.length || f.g !== "all" ? " avec les filtres choisis" : ""}.</p>`}`;
  };
  const drawMonth = () => {
    LS.set("calMonth", month);
    const [y, m] = month.split("-").map(Number);
    const first = new Date(y, m - 1, 1), days = new Date(y, m, 0).getDate();
    const offset = (first.getDay() + 6) % 7, cells = Math.ceil((offset + days) / 7) * 7;
    const inMonth = [...byDay.keys()].filter(k => k.startsWith(month)).sort();
    if (!selected || !selected.startsWith(month)) {
      const upcoming = inMonth.find(k => (byDay.get(k) || []).some(x => !isPast(x)));
      selected = upcoming || inMonth[0] || null;
    }
    const mi = months.indexOf(month);
    const title = first.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
    const nRaces = inMonth.reduce((a, k) => a + byDay.get(k).length, 0);
    let grid = "";
    for (let c = 0; c < cells; c++) {
      const dn = c - offset + 1;
      if (dn < 1 || dn > days) { grid += `<div class="mday out" aria-hidden="true"></div>`; continue; }
      const k = `${month}-${String(dn).padStart(2, "0")}`;
      const items = byDay.get(k) || [];
      const ev = eventStartsOn.get(k);
      const label = `${dn} ${first.toLocaleDateString("fr-FR", { month: "long" })}${items.length ? ` : ${items.length} course${items.length > 1 ? "s" : ""}` : ""}`;
      grid += `<button type="button" class="mday${items.length ? " has" : ""}${k === todayK ? " today" : ""}${k === selected ? " sel" : ""}${items.length && items.every(isPast) ? " past" : ""}" data-k="${k}" aria-label="${esc(label)}" aria-pressed="${k === selected}">
        <span class="dn">${dn}</span>${ev ? `<span class="mev">${esc(ev.ShortDescription || "")}</span>` : ""}
        <span class="mps">${items.map(x => `<span class="mp g-${raceCat(x.r)}" title="${esc(x.d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) + " " + raceTitle(x.r))}"><span class="mpt">${esc(x.d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }))} ${esc(DISC_SHORT[raceDisc(x.r)] || raceDisc(x.r))} ${esc(CAT_SHORT[raceCat(x.r)] || "")}</span></span>`).join("")}</span></button>`;
    }
    $("#month-panel", root).innerHTML = `<div class="ph month-head">
        <button class="btn ghost sm" id="m-prev" type="button" aria-label="Mois précédent"${mi <= 0 ? " disabled" : ""}>‹</button>
        <h2 aria-live="polite">${esc(title.charAt(0).toUpperCase() + title.slice(1))}</h2>
        <button class="btn ghost sm" id="m-next" type="button" aria-label="Mois suivant"${mi >= months.length - 1 ? " disabled" : ""}>›</button>
        <span class="small muted month-count">${nRaces} course${nRaces > 1 ? "s" : ""}</span>
        <span class="legend mlegend"><span><i class="g-bg-SW"></i>Femmes</span><span><i class="g-bg-SM"></i>Hommes</span><span><i class="g-bg-MX"></i>Mixte</span></span></div>
      <div class="pb"><div class="mgrid" role="group" aria-label="Jours du mois">${WEEK.map(w => `<div class="mwd">${w}</div>`).join("")}${grid}</div>
      <div class="dday" id="dday">${selected ? dayDetail(selected) : `<p class="muted small" style="margin:0">Aucune course ce mois-ci.</p>`}</div></div>`;
    $("#m-prev", root).addEventListener("click", () => { month = months[Math.max(0, mi - 1)]; selected = null; drawMonth(); });
    $("#m-next", root).addEventListener("click", () => { month = months[Math.min(months.length - 1, mi + 1)]; selected = null; drawMonth(); });
    root.querySelectorAll(".mday[data-k]").forEach(b => b.addEventListener("click", () => {
      selected = b.dataset.k;
      root.querySelectorAll(".mday[data-k]").forEach(x => { const on = x === b; x.classList.toggle("sel", on); x.setAttribute("aria-pressed", String(on)); });
      $("#dday", root).innerHTML = dayDetail(selected);
    }));
  };
  if (!noCal) drawMonth();

  /* Liste complète */
  const dl = $("#dl-sel", root);
  dl.disabled = !list.length; dl.textContent = `Télécharger la sélection : ${list.length} course${list.length > 1 ? "s" : ""} (.ics)`;
  dl.addEventListener("click", () => { downloadText(`biathlon-${sid}-selection.ics`, icsDoc(`Biathlon ${seasonLabel(sid)}`, list, true)); toast("Fichier téléchargé : ouvrez-le pour ajouter les courses à votre agenda"); });
  const olBtn = $("#ol-import", root); olBtn.textContent = `Télécharger les ${seasonItems.length} courses et ouvrir Outlook`;
  $("#ol-count", root).textContent = `Les ${seasonItems.length} courses de la saison arrivent dans votre agenda en une fois, avec un rappel 30 minutes avant chaque départ.`;
  olBtn.addEventListener("click", () => {
    // Ouvrir Outlook d'abord, dans le geste de l'utilisateur, pour ne pas être bloqué par le navigateur.
    window.open(OUTLOOK_HOST[olKind] + "/calendar/view/month", "_blank", "noopener");
    downloadText(importName, icsDoc(feedName, seasonItems, true));
    toast(`${seasonItems.length} courses téléchargées : importez le fichier dans Outlook`);
  });

  /* Volet « Toutes les courses » : n'importe quelle saison archivée */
  $("#list-toggle", root).addEventListener("click", ev => {
    const body = $("#list-body", root), open = body.hidden;
    body.hidden = !open; $("#list-panel", root).classList.toggle("closed", !open); LS.set("calListOpen", open);
    ev.currentTarget.setAttribute("aria-expanded", String(open));
  });
  const drawList = async lsid => {
    LS.set("calListSeason", lsid);
    $("#hide-past-l", root).hidden = lsid !== sid;
    const out = $("#out", root);
    let items = list;
    if (lsid !== sid) {
      out.innerHTML = loadingHTML();
      let other; try { other = await season(lsid); } catch (e) { out.innerHTML = errorHTML(e); return; }
      if ($("#list-season", root).value !== lsid) return;
      items = [];
      (other.events || []).forEach(e => (e.races || []).forEach(r => { if (r.StartTime) items.push({ r, e, d: new Date(r.StartTime) }); }));
      items = items.filter(x => inCat(x) && inDisc(x)).sort((a, b) => a.d - b.d);
    }
    const nb = items.length, nEv = new Set(items.map(x => x.e.EventId)).size;
    $("#list-count", root).textContent = `${seasonLabel(lsid)} · ${nEv} étape${nEv > 1 ? "s" : ""}, ${nb} course${nb > 1 ? "s" : ""}`;
    if (!nb) { out.innerHTML = `<div class="note">${lsid === sid && f.hidePast && shown.length ? "Toutes les courses correspondant aux filtres sont passées : décochez « Masquer les courses passées »." : "Aucune course ne correspond aux filtres pour cette saison."}</div>`; return; }
    const today = ymd(new Date());
    const groups = [];
    items.forEach(x => { let g = groups.find(g => g.e.EventId === x.e.EventId); if (!g) groups.push(g = { e: x.e, days: [] });
      let day = g.days.find(d => d.k === ymd(x.d)); if (!day) g.days.push(day = { k: ymd(x.d), d: x.d, items: [] }); day.items.push(x); });
    let nWc = 0;
    out.innerHTML = `<div class="events">${groups.map(g => {
      const wc = /RLCP/.test(g.e.EventId); if (wc) nWc++;
      const now = String(g.e.StartDate).slice(0, 10) <= today && today <= String(g.e.EndDate).slice(0, 10);
      return `<section class="ev${now ? " now" : ""}">
      <div class="ev-head"><span><span class="ev-no">${wc ? String(nWc).padStart(2, "0") : /RLOG/.test(g.e.EventId) ? "JO" : "CM"}</span><span class="pl">${esc(g.e.ShortDescription || g.e.Organizer || "")}</span> ${natHTML(g.e.Nat)}${eventKind(g.e.EventId) !== "Coupe du monde" ? ` <span class="tag live">${esc(eventKind(g.e.EventId))}</span>` : ""}${now ? ' <span class="tag live">En cours</span>' : ""}</span>
        <span class="small muted">${fmtDate(g.e.StartDate)} – ${fmtDate(g.e.EndDate)}</span></div>
      ${g.days.map(day => `<div class="cal-day"><div class="cal-date">${esc(day.d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric" }))}<small>${esc(day.d.toLocaleDateString("fr-FR", { month: "long", ...(lsid !== sid ? { year: "numeric" } : {}) }))}</small></div>
        <div class="cal-races">${day.items.map(raceRow).join("")}</div></div>`).join("")}
    </section>`; }).join("")}</div>`;
  };
  $("#list-season", root).addEventListener("change", e => drawList(e.target.value));
  drawList(listSid);
}

function formatStrip(fmt) {
  const legs = fmt.legs || 1;
  const leg = i => {
    let h = "";
    for (let l = 0; l < fmt.laps; l++) {
      h += `<span class="fs-lap" title="Tour ${l + 1}">Tour ${l + 1}</span>`;
      if (l < fmt.shoot.length) {
        const p = fmt.shoot[l];
        h += `<span class="fs-shot fs-${p}" title="${p === "P" ? "Tir couché" : "Tir debout"}">${p === "P" ? ICON_P : ICON_S}<b>${p === "P" ? "Couché" : "Debout"}</b></span>`;
      }
    }
    if (fmt.finalLap && i === legs - 1) h += `<span class="fs-lap" title="Tour final">Tour final</span>`;
    return `<div class="fs-leg">${legs > 1 ? `<span class="fs-legname">Relayeur ${i + 1}${fmt.id === "MR" ? (i < 2 ? " · F" : " · H") : fmt.id === "SR" ? (i % 2 ? " · H" : " · F") : ""}</span>` : ""}<div class="fs-row"><span class="fs-flag">${i === 0 ? "Départ" : "Relais"}</span>${h}<span class="fs-flag">${i === legs - 1 ? "Arrivée" : "→"}</span></div></div>`;
  };
  return `<div class="fstrip" role="img" aria-label="${esc(fmt.name)} : ${fmt.laps} tours et ${fmt.shoot.length} tirs ${legs > 1 ? "par relayeur" : ""}, ordre ${[...fmt.shoot].map(p => p === "P" ? "couché" : "debout").join(", ")}">${Array.from({ length: legs }, (_, i) => leg(i)).join("")}</div>`;
}

    const spares = miss ? (loops ? 3 : hit) : 0;
    $("#spare-vis", root).innerHTML = `<div class="sv-row"><span class="small">Cibles</span><span class="stage">${tg.map(t => `<i class="tg ${t === "m" ? "m" : "h"}${t === "s" ? " spare" : ""}"></i>`).join("")}</span></div>
      <div class="sv-row"><span class="small">Balles</span><span class="ammo">${[...Array(5)].map(() => '<i class="b"></i>').join("")}${[...Array(spares)].map(() => '<i class="b sp"></i>').join("")}</span></div>
      <p class="analogy">${miss === 0 ? "5 balles, 5 cibles : aucune balle de pioche, on repart aussitôt." : `${spares} balle${spares > 1 ? "s" : ""} de pioche utilisée${spares > 1 ? "s" : ""} (chargées une par une, environ 5 secondes chacune)${loops ? `, et <b>${loops} tour${loops > 1 ? "s" : ""} de pénalité</b> pour ${loops > 1 ? "les cibles restantes" : "la cible restante"}` : ", <b>sans tour de pénalité</b>"}.`}</p>`;
  };
  $("#sp-miss", root).addEventListener("input", drawSpare); $("#sp-hit", root).addEventListener("input", drawSpare); drawSpare();

  /* ---------- 6. vitesses ---------- */
  let biathlonKmh = 25, speedSource = "ordre de grandeur";
  try {
    const sid = META.currentResultsSeason; const s = await season(sid);
    const sprints = (s.events || []).flatMap(e => e.races || []).filter(r => r.RaceId.endsWith("SMSP") && r.km).sort((a, b) => String(b.StartTime).localeCompare(String(a.StartTime)));
    for (const r of sprints.slice(0, 4)) {
      const an = await data(`analysis/${r.RaceId}.json`).catch(() => null);
      const times = an ? Object.values(an.athletes || {}).map(x => x.c && secs(x.c[0])).filter(Boolean) : [];
      if (times.length) { const best = Math.min(...times); biathlonKmh = +r.km / (best / 3600); speedSource = `le skieur le plus rapide du sprint hommes de ${r.StartTime ? new Date(r.StartTime).toLocaleDateString("fr-FR", { month: "long", year: "numeric" }) : "la saison"}, d'après les temps de ski de l'IBU`; break; }
    }
  } catch (e) {}
  const SPEEDS = [
    { n: "Marche", v: 5 }, { n: "Footing", v: 10 }, { n: "Record du marathon", v: 21 }, { n: "Biathlète sur les skis", v: biathlonKmh, hi: true },
    { n: "Descente en biathlon", v: 50, note: "environ" }, { n: "Voiture en ville", v: 50 }, { n: "Balle de carabine", v: 1220 },
  ];
  let scale = "lin";
  const drawSpeeds = () => {
    const max = Math.max(...SPEEDS.map(s => s.v)), lmin = Math.log10(3), lmax = Math.log10(max);
    const w = v => scale === "log" ? 100 * (Math.log10(v) - lmin) / (lmax - lmin) : 100 * v / max;
    $("#speed-chart", root).innerHTML = `<div class="hbars">${SPEEDS.map(s => `<div class="hb-row${s.hi ? " hi" : ""}"><span class="hb-l">${esc(s.n)}</span><div class="hb-bars"><span class="hb${s.hi ? " hb-hi" : ""}" style="width:${Math.max(0.6, w(s.v)).toFixed(1)}%"><b>${s.note ? "≈ " : ""}${nf(s.v, s.v < 30 ? 1 : 0)} km/h</b></span></div></div>`).join("")}</div>`;
    $("#speed-note", root).textContent = scale === "lin" ? "En échelle normale, la balle écrase tout : passez en échelle logarithmique pour comparer les autres vitesses." : "En échelle logarithmique, chaque graduation multiplie la vitesse : on voit enfin la différence entre un footing et un biathlète.";
  };
  root.querySelectorAll("[data-scale]").forEach(b => b.addEventListener("click", () => { scale = b.dataset.scale; root.querySelectorAll("[data-scale]").forEach(x => x.classList.toggle("on", x === b)); drawSpeeds(); }));
  drawSpeeds();
  const drawTimes = () => {
    const d = +$("#dist", root).value; $("#dist-v", root).textContent = nf(d) + " km";
    const rows = [["Vous, en marchant", 5], ["Vous, en footing", 10], ["Un biathlète sur les skis", biathlonKmh]];
    $("#time-out", root).innerHTML = rows.map(([n, v]) => { const t = d / v * 3600;
      return `<div class="to-row"><span>${n}</span><b class="mono">${t >= 3600 ? Math.floor(t / 3600) + " h " + String(Math.round(t % 3600 / 60)).padStart(2, "0") : Math.round(t / 60) + " min"}</b></div>`; }).join("");
  };
  $("#dist", root).addEventListener("input", drawTimes); drawTimes();
  $("#speed-facts", root).innerHTML = [
    `Sur les skis, un biathlète avance à environ <b>${nf(biathlonKmh, 0)} km/h</b> en moyenne : la vitesse d'un cycliste du dimanche, mais à la force des bras et des jambes. <span class="muted">(Source : ${esc(speedSource)}.)</span>`,
    `La balle sort du canon à environ <b>340 m/s</b> : elle met <b>0,15 seconde</b> pour franchir les 50 m, moins qu'un clignement d'œil.`,
    `En arrivant au pas de tir, le cœur bat à <b>170–180 battements par minute</b>, soit 3 par seconde. Le tireur appuie sur la détente entre deux battements.`,
    `Un tour de pénalité de 150 m coûte environ <b>25 secondes</b> : à ${nf(biathlonKmh, 0)} km/h, c'est près de <b>${nf(25 * biathlonKmh / 3.6, 0)} m</b> de piste perdus.`,
  ].map(t => `<li>${t}</li>`).join("");

  /* ---------- 7. points ---------- */
  let ptsMode = "std";
  const drawPts = () => {
    const arr = ptsMode === "ms" ? MS_POINTS : WC_POINTS;
    $("#pts-chart", root).innerHTML = `<div class="vbars" role="img" aria-label="Points par place, de 1 à ${arr.length}">${arr.map((p, i) => `<span class="vb${i < 3 ? " top" + (i + 1) : ""}" style="height:${(100 * p / 90).toFixed(1)}%" title="${i + 1}${i ? "e" : "er"} : ${p} points"></span>`).join("")}</div>
      <div class="vb-axis"><span>1er</span><span>10e</span><span>20e</span><span>${arr.length}e</span></div>`;
    const place = Math.max(1, Math.round(+$("#pts-place", root).value || 1)), pts = arr[place - 1] || 0;
    $("#pts-out", root).innerHTML = pts ? `${place === 1 ? "Une victoire" : `Une ${place}e place`} rapporte <b>${pts} point${pts > 1 ? "s" : ""}</b>${place > 1 ? `, soit ${nf(100 * pts / 90, 0)} % d'une victoire` : ""}.` : `Au-delà de la ${arr.length}e place, on ne marque <b>aucun point</b>${ptsMode === "ms" ? " (en mass start, seuls 30 athlètes prennent le départ)" : ""}.`;
    root.querySelectorAll(".vb").forEach((b, i) => b.classList.toggle("cur", i === place - 1));
  };
  root.querySelectorAll("[data-pts]").forEach(b => b.addEventListener("click", () => { ptsMode = b.dataset.pts; root.querySelectorAll("[data-pts]").forEach(x => x.classList.toggle("on", x === b)); drawPts(); }));
  $("#pts-place", root).addEventListener("input", drawPts); drawPts();

  /* ---------- 8. quiz ---------- */
  const Q = [
    { q: "À quelle distance se trouvent les cibles ?", a: ["25 m", "50 m", "100 m"], ok: 1, why: "Toujours 50 m, en position couchée comme debout." },
    { q: "Quelle est la taille de la zone à toucher en position couchée ?", a: ["Une pièce de 1 €", "Une balle de golf", "Un CD"], ok: 1, why: "4,5 cm, à peine plus qu'une balle de golf (4,27 cm). Debout, c'est 11,5 cm, la taille d'un CD." },
    { q: "En individuel, que coûte une cible manquée ?", a: ["Un tour de 150 m", "45 secondes", "Une minute"], ok: 2, why: "Une minute ajoutée au temps. En individuel court, c'est 45 secondes." },
    { q: "Combien de balles de pioche a un relayeur à chaque tir ?", a: ["Aucune", "3", "5"], ok: 1, why: "3 balles, chargées à la main, avant de devoir faire des tours de pénalité." },
    { q: "En poursuite, qui gagne ?", a: ["Le meilleur temps total", "Le premier à franchir la ligne", "Celui qui a le moins de fautes"], ok: 1, why: "Les départs sont décalés selon le sprint : le premier sur la ligne est le vainqueur." },
    { q: "Combien de points rapporte une victoire en Coupe du monde ?", a: ["60", "90", "100"], ok: 1, why: "90 points pour la victoire, 75 pour la 2e place, 65 pour la 3e." },
    { q: "Que signifie le dossard jaune ?", a: ["Le plus jeune athlète", "Le leader du classement général", "Le vainqueur de la veille"], ok: 1, why: "Il est porté par le leader du classement général de la Coupe du monde." },
  ];
  const answers = new Array(Q.length).fill(null);
  const drawQuiz = () => {
    const good = answers.filter((a, i) => a === Q[i].ok).length, done = answers.filter(a => a != null).length;
    $("#quiz-score", root).textContent = done ? `${good} / ${Q.length} bonnes réponses` : `${Q.length} questions`;
    $("#quiz", root).innerHTML = `<ol class="quiz">${Q.map((q, i) => `<li><p class="qq">${esc(q.q)}</p><div class="qa">${q.a.map((t, k) => {
        const st = answers[i] == null ? "" : k === q.ok ? " good" : k === answers[i] ? " bad" : " dim";
        return `<button type="button" class="chip${st}" data-q="${i}" data-a="${k}"${answers[i] != null ? " disabled" : ""}>${esc(t)}</button>`; }).join("")}</div>
      ${answers[i] != null ? `<p class="small qwhy">${answers[i] === q.ok ? "✓ Bien vu. " : "✗ Raté. "}${esc(q.why)}</p>` : ""}</li>`).join("")}</ol>
      ${done === Q.length ? `<div class="analogy">${good === Q.length ? "Sans-faute ! Vous êtes prêt pour le dossard jaune." : good >= 5 ? "Très bien : quelques tours de pénalité, mais un beau podium." : "Quelques tours de pénalité… relisez les sections au-dessus et retentez !"} <button type="button" class="btn ghost sm" id="quiz-reset">Recommencer</button></div>` : ""}`;
    root.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => { answers[+b.dataset.q] = +b.dataset.a; drawQuiz(); }));
    const rs = $("#quiz-reset", root); if (rs) rs.addEventListener("click", () => { answers.fill(null); drawQuiz(); });
  };
  drawQuiz();
}

/* Jeu de tir : la visée oscille selon la position et le rythme cardiaque */
function setupShootingGame(root) {
  const cv = $("#game", root), ctx = cv.getContext("2d");
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let pos = "P", bpm = 170, shots = [], t0 = performance.now(), raf = 0, W = 600, H = 250, dpr = 1, lastShot = null;
  const geo = () => { const R = Math.min(W * 0.062, H * 0.2); return { R, hitR: pos === "P" ? R * 45 / 115 : R, cy: H * 0.52, cx: i => W * (0.18 + i * 0.16) }; };
  const resize = () => { dpr = window.devicePixelRatio || 1; W = cv.clientWidth || 600; H = Math.round(Math.min(W * 0.42, 300)); cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + "px"; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  const aim = t => {
    const g = geo(), i = Math.min(shots.length, 4);
    const A = g.R * (pos === "P" ? 0.27 : 0.6) * Math.pow(bpm / 100, 1.5);
    const s = t / 1000;
    let x = A * (0.8 * Math.sin(1.1 * s) + 0.45 * Math.sin(2.7 * s + 1.3) + 0.22 * Math.sin(5.3 * s + 0.4));
    let y = A * (0.7 * Math.sin(0.9 * s + 2) + 0.5 * Math.sin(2.3 * s + 0.7) + 0.2 * Math.sin(6.1 * s));
    const ph = (s * bpm / 60) % 1; if (ph < 0.14) y -= A * 0.7 * Math.sin(ph / 0.14 * Math.PI);
    return { x: g.cx(i) + x, y: g.cy + y, ph };
  };
  const draw = now => {
    if (!document.body.contains(cv)) return;
    const g = geo(), ink = css("--ink"), paper = css("--paper"), muted = css("--muted"), red = css("--red");
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = css("--line-soft"); ctx.beginPath(); ctx.roundRect ? ctx.roundRect(W * 0.08, g.cy - g.R * 1.9, W * 0.84, g.R * 3.8, 12) : ctx.rect(W * 0.08, g.cy - g.R * 1.9, W * 0.84, g.R * 3.8); ctx.fill();
    for (let i = 0; i < 5; i++) {
      const sh = shots[i];
      ctx.beginPath(); ctx.arc(g.cx(i), g.cy, g.R, 0, Math.PI * 2);
      ctx.fillStyle = sh && sh.hit ? "#F3F6F8" : "#111A20"; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = sh && sh.hit ? "#B9C4CC" : "#000"; ctx.stroke();
      if (pos === "P" && !(sh && sh.hit)) { ctx.beginPath(); ctx.arc(g.cx(i), g.cy, g.hitR, 0, Math.PI * 2); ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1; ctx.stroke(); }
      if (sh && !sh.hit) { ctx.beginPath(); ctx.arc(sh.x, sh.y, 3.5, 0, Math.PI * 2); ctx.fillStyle = red; ctx.fill(); }
      if (i === shots.length && shots.length < 5) { ctx.fillStyle = muted; ctx.font = "12px system-ui"; ctx.textAlign = "center"; ctx.fillText("▲", g.cx(i), g.cy + g.R + 18); }
    }
    if (shots.length < 5) {
      const a = aim(now - t0); const r = g.R * 0.75;
      ctx.strokeStyle = red; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(a.x, a.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(a.x - r - 8, a.y); ctx.lineTo(a.x - 4, a.y); ctx.moveTo(a.x + 4, a.y); ctx.lineTo(a.x + r + 8, a.y);
      ctx.moveTo(a.x, a.y - r - 8); ctx.lineTo(a.x, a.y - 4); ctx.moveTo(a.x, a.y + 4); ctx.lineTo(a.x, a.y + r + 8); ctx.stroke();
      const heart = $("#heart", root); if (heart) heart.classList.toggle("beat", a.ph < 0.14);
    }
    if (lastShot && now - lastShot.t < 250) { ctx.globalAlpha = 1 - (now - lastShot.t) / 250; ctx.beginPath(); ctx.arc(lastShot.x, lastShot.y, 10 + (now - lastShot.t) / 10, 0, Math.PI * 2); ctx.strokeStyle = ink; ctx.stroke(); ctx.globalAlpha = 1; }
    ctx.fillStyle = muted; ctx.font = "12px system-ui"; ctx.textAlign = "left";
    ctx.fillText(`${pos === "P" ? "Couché" : "Debout"} · balle ${Math.min(shots.length + 1, 5)}/5`, W * 0.08, H - 8);
    raf = requestAnimationFrame(draw);
  };
  const result = () => {
    const out = $("#game-res", root); const hits = shots.filter(s => s.hit).length, miss = 5 - hits;
    if (shots.length < 5) { out.innerHTML = `<span class="stage">${shots.map(s => `<i class="tg ${s.hit ? "h" : "m"}"></i>`).join("")}</span>`; return; }
    out.innerHTML = `<div class="analogy"><span class="stage">${shots.map(s => `<i class="tg ${s.hit ? "h" : "m"}"></i>`).join("")}</span>
      <b>${hits}/5</b>${miss ? ` : en sprint, ${miss} tour${miss > 1 ? "s" : ""} de pénalité (≈ ${miss * 25} s) ; en individuel, ${miss} minute${miss > 1 ? "s" : ""} ajoutée${miss > 1 ? "s" : ""}.` : " : sans-faute, bravo !"}
      ${bpm >= 150 ? `<span class="small"> Essayez à ${pos === "P" ? "120" : "100"} bpm pour sentir la différence.</span>` : ""}</div>`;
  };
  const fire = () => {
    if (shots.length >= 5) return;
    const g = geo(), a = aim(performance.now() - t0), i = shots.length;
    const hit = Math.hypot(a.x - g.cx(i), a.y - g.cy) <= g.hitR;
    shots.push({ hit, x: a.x, y: a.y }); lastShot = { x: a.x, y: a.y, t: performance.now() }; result();
  };
  const reset = () => { shots = []; t0 = performance.now(); result(); };
  cv.addEventListener("pointerdown", e => { e.preventDefault(); fire(); });
  cv.addEventListener("keydown", e => { if (e.code === "Space" || e.key === "Enter") { e.preventDefault(); fire(); } });
  $("#fire", root).addEventListener("click", fire);
  $("#reset", root).addEventListener("click", reset);
  root.querySelectorAll("[data-gpos]").forEach(b => b.addEventListener("click", () => { pos = b.dataset.gpos; root.querySelectorAll("[data-gpos]").forEach(x => x.classList.toggle("on", x === b)); reset(); }));
  $("#bpm", root).addEventListener("input", e => { bpm = +e.target.value; $("#bpm-v", root).textContent = bpm; $("#heart", root).style.animationDuration = (60 / bpm) + "s"; });
  const ro = new ResizeObserver(() => { if (!document.body.contains(cv)) { ro.disconnect(); return; } resize(); });
  ro.observe(cv); resize(); result(); raf = requestAnimationFrame(draw);
}

/* ================================================================ apparence */
function applyTheme(v) {
  const root = document.documentElement;
  if (v === "light" || v === "dark") root.dataset.theme = v; else { delete root.dataset.theme; v = "auto"; }
  LS.set("theme", v);
  document.querySelectorAll("[data-theme-set]").forEach(b => {
    const on = b.dataset.themeSet === v; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on));
  });
}
document.querySelectorAll("[data-theme-set]").forEach(b => b.addEventListener("click", () => applyTheme(b.dataset.themeSet)));
applyTheme(LS.get("theme", "auto"));

/* ================================================================ routeur */
async function route() {
  clearInterval(liveTimer); liveTimer = null; CHARTS.clear();
  const root = $("#view");
  const [page, arg, arg2] = location.hash.replace(/^#\/?/, "").split("/");
  const tab = { decouvrir: "decouvrir", calendrier: "courses", courses: "courses", course: "courses", recherche: "athletes", athlete: "athletes", nations: "athletes", nation: "athletes", comparer: "athletes" }[page] || "classements";
  document.querySelectorAll("nav.tabs a").forEach(a => { const on = a.dataset.tab === tab; a.classList.toggle("on", on); on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"); });
  window.scrollTo(0, 0);
  if (!META) {
    root.innerHTML = loadingHTML("Chargement");
    try { await boot(); } catch (e) { root.innerHTML = errorHTML(e instanceof Missing ? new Error("Les données ne sont pas encore générées. Revenez dans quelques minutes.") : e); return; }
  }
  const a = decodeURIComponent(arg || "");
  if (page === "decouvrir") return viewDiscover(root);
  if (page === "calendrier") return viewCalendar(root, a);
  if (page === "nations") return viewNations(root);
  if (page === "nation" && a) return viewNation(root, a);
  if (page === "courses") return viewCalendar(root);
  if (page === "course" && a && arg2) return viewRaceCompare(root, a, decodeURIComponent(arg2));
  if (page === "course" && a) return viewRace(root, a);
  if (page === "recherche") return viewSearch(root);
  if (page === "athlete" && a) return viewAthlete(root, a);
  if (page === "comparer") return viewCompare(root, a);
  return viewStandings(root);
}
window.addEventListener("hashchange", route);
route();
</script>
