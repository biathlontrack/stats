<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1C25">
<meta name="description" content="Classements de la Coupe du monde de biathlon, résultats des courses, fiches et statistiques des athlètes, à partir des données IBU.">
<title>Biathlon Datacenter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230E1C25'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23F3F6F8' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23F2C300'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>

/* Layout : bandeau d'encre en tête, une colonne de travail de 1100px, tableaux de résultats façon tableau d'affichage du stade. */
:root{
  --snow:#F3F6F8; --paper:#FFFFFF; --ink:#0E1C25; --muted:#5A6B77; --line:#DAE2E7; --line-soft:#EAF0F3;
  --accent:#1D5A8C; --accent-soft:#E3EEF7; --bib:#F2C300; --bib-ink:#2B2300; --red:#C8262F;
  --gold:#C9A227; --silver:#9AA6AE; --bronze:#B07444; --hit:#FFFFFF; --target:#111A20; --good:#2F7D4F;
  --band:#0E1C25; --band-ink:#F3F6F8; --band-muted:#94A6B2;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --snow:#0B1318; --paper:#111C23; --ink:#E6EDF1; --muted:#8FA1AC; --line:#22323C; --line-soft:#1A262E;
  --accent:#7DB4E3; --accent-soft:#16293A; --bib:#F2C300; --bib-ink:#2B2300; --red:#F0636B;
  --gold:#D9B33D; --silver:#B4BFC6; --bronze:#C98A58; --hit:#F3F6F8; --target:#000000; --good:#5DBB84;
  --band:#060C10; --band-ink:#E6EDF1; --band-muted:#7F929E; color-scheme:dark}}
:root[data-theme="dark"]{
  --snow:#0B1318; --paper:#111C23; --ink:#E6EDF1; --muted:#8FA1AC; --line:#22323C; --line-soft:#1A262E;
  --accent:#7DB4E3; --accent-soft:#16293A; --bib:#F2C300; --bib-ink:#2B2300; --red:#F0636B;
  --gold:#D9B33D; --silver:#B4BFC6; --bronze:#C98A58; --hit:#F3F6F8; --target:#000000; --good:#5DBB84;
  --band:#060C10; --band-ink:#E6EDF1; --band-muted:#7F929E; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--snow);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
img{max-width:100%}
[hidden]{display:none!important}

.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--band);color:var(--band-ink);position:sticky;top:0;z-index:20}
.band .wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;color:var(--band-ink)}
.brand:hover{text-decoration:none}
.brand .t5{display:flex;gap:3px}
.brand .t5 i{width:9px;height:9px;border-radius:50%;background:var(--band-ink);display:block}
.brand .t5 i:nth-child(4){background:transparent;box-shadow:inset 0 0 0 1.5px var(--band-muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{color:var(--band-muted);font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:4px}
nav.tabs a:hover{color:var(--band-ink);text-decoration:none;background:rgba(255,255,255,.06)}
nav.tabs a.on{color:var(--band-ink);box-shadow:inset 0 -3px 0 var(--bib)}

main{padding-block:28px 64px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,5vw,44px);text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:65ch;margin:8px 0 0}
.stack{display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-direction:column;gap:6px}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input[type=text],input[type=search]{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:38px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
.seg button{font:inherit;font-weight:500;border:0;background:transparent;color:var(--muted);padding:8px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn{font:inherit;font-weight:600;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:6px;padding:8px 14px;cursor:pointer;min-height:38px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px}
.panel>.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel>.pb{padding:16px}
.scroll{overflow-x:auto}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--accent-soft)}
td.num,th.num{text-align:right}
td.rk{font-family:var(--display);font-weight:700;font-size:18px;width:52px}
td.mono,.mono{font-family:var(--mono);font-size:13.5px}
.nm{font-weight:600;color:var(--ink)}
.nm:hover{color:var(--accent)}
.nat{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.flag{font-size:16px;line-height:1}
.muted{color:var(--muted)}
.small{font-size:13px}

.bib{display:inline-block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:3px;margin-left:8px;vertical-align:2px}
.bib.y{background:var(--bib);color:var(--bib-ink)}
.bib.r{background:var(--red);color:#fff}
.med{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-family:var(--display);font-weight:700;font-size:14px;color:#14100A}
.med.g{background:var(--gold)}.med.s{background:var(--silver)}.med.b{background:var(--bronze)}

/* Cibles : 5 par passage. Blanc = touché (le volet blanc tombe), noir cerclé de rouge = manqué. */
.targets{display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.stage{display:inline-flex;gap:2px}
.tg{width:10px;height:10px;border-radius:50%;display:block}
.tg.h{background:var(--hit);box-shadow:inset 0 0 0 2px var(--target)}
.tg.m{background:var(--target);box-shadow:0 0 0 1.5px var(--red)}
.sh-raw{font-family:var(--mono);font-size:12.5px;color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--paper);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.kpi span{font-size:12px;color:var(--muted);letter-spacing:.04em}

.profile{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start}
.photo{width:120px;height:150px;border-radius:8px;background:var(--line-soft);object-fit:cover;border:1px solid var(--line)}
.photo.ph0{display:grid;place-items:center;font-family:var(--display);font-size:42px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 22px;margin-top:14px}
.fact{min-width:0}
.fact dt{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fact dd{margin:0;overflow-wrap:anywhere}
@media (max-width:560px){.profile{grid-template-columns:1fr}.photo{width:96px;height:120px}}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.grid2>*{min-width:0}
.events{display:flex;flex-direction:column;gap:10px}
.ev{background:var(--paper);border:1px solid var(--line);border-radius:8px}
.ev>button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 16px;cursor:pointer}
.ev>button:focus-visible{outline:2px solid var(--accent)}
.ev .no{font-family:var(--display);font-size:22px;font-weight:700;color:var(--muted)}
.ev .pl{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase}
.ev.now{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.races{border-top:1px solid var(--line);padding:6px 16px 12px}
.race{display:grid;grid-template-columns:1fr auto;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.race:last-child{border-bottom:0}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--line-soft);color:var(--muted)}
.tag.live{background:var(--red);color:#fff}

.note{background:var(--accent-soft);border-radius:8px;padding:12px 16px;color:var(--ink);font-size:14px}
.err{border:1px solid var(--red);border-radius:8px;padding:14px 16px;background:var(--paper)}
.err b{color:var(--red)}
.loading{color:var(--muted);padding:24px 0;display:flex;gap:10px;align-items:center}
.loading .t5{display:flex;gap:4px}
.loading .t5 i{width:9px;height:9px;border-radius:50%;background:var(--muted);opacity:.3;animation:shot 1.2s infinite}
.loading .t5 i:nth-child(2){animation-delay:.15s}.loading .t5 i:nth-child(3){animation-delay:.3s}.loading .t5 i:nth-child(4){animation-delay:.45s}.loading .t5 i:nth-child(5){animation-delay:.6s}
@keyframes shot{0%,100%{opacity:.3}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.loading .t5 i{animation:none;opacity:.6}}

.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.bar{height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.split{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.show-sm{display:none}
@media (max-width:600px){header.band{position:static}.hide-sm{display:none}.show-sm{display:block}.targets .sh-raw{display:none}td,th{padding:8px 8px}td.rk{width:40px;font-size:16px}nav.tabs a{font-size:15px;padding:5px 8px}}
footer{color:var(--muted);font-size:13px;padding-block:24px;border-top:1px solid var(--line)}

header.band{top:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
header.band{padding-top:env(safe-area-inset-top,0px)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.badge{display:inline-flex;gap:6px;align-items:baseline;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper)}
.badge b{font-family:var(--mono);font-weight:500;color:var(--accent)}
td.legs{padding-top:0}
.leg{display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;font-size:13px;padding:3px 0;color:var(--muted)}
.leg a{color:var(--ink)}
.fresh{display:inline-flex;align-items:center;gap:6px}
.fresh i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.fresh.old i{background:var(--muted)}
.rk1{color:var(--gold)}
td.medal-1{font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--gold) 22%,transparent)}
td.medal-2{font-weight:700;background:color-mix(in srgb,var(--silver) 25%,transparent)}
td.medal-3{font-weight:700;background:color-mix(in srgb,var(--bronze) 22%,transparent)}
.sub{font-size:12px;color:var(--muted);font-family:var(--body)}
.ext{font-size:13px}
th.grp{text-align:center;border-bottom:0;padding-bottom:0}
@media (max-width:600px){header.band{position:sticky}.band .wrap{gap:6px 16px;padding-block:8px}}
/* Calendrier */
.next{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;background:var(--band);color:var(--band-ink);border-radius:8px;padding:16px 18px}
.next .when{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;color:var(--bib)}
.next .when small{display:block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--band-muted);font-weight:600;margin-top:4px}
.next .what{min-width:0}
.next .what b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.02em;display:block}
.next .what span{color:var(--band-muted);font-size:14px}
.subs{display:flex;flex-direction:column;gap:12px}
.subs .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.subs code{font-family:var(--mono);font-size:12.5px;background:var(--line-soft);padding:6px 8px;border-radius:4px;overflow-wrap:anywhere;flex:1 1 260px;min-width:0}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
a.btn:hover{text-decoration:none}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.cal-day{display:grid;grid-template-columns:92px 1fr;gap:4px 14px;padding:10px 16px;border-top:1px solid var(--line-soft)}
.cal-day:first-child{border-top:0}
.cal-date{font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.03em;padding-top:6px}
.cal-date small{display:block;font-family:var(--body);font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:12px}
.cal-races{display:flex;flex-direction:column;min-width:0}
.cal-race{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.cal-race:last-child{border-bottom:0}
.cal-race .t{font-family:var(--mono);font-size:15px;font-weight:500}
.cal-race .n{min-width:0}
.cal-race .n a{font-weight:600;color:var(--ink)}
.cal-race .acts{display:flex;gap:6px}
.cal-race.past{opacity:.55}
.g-SW{color:#B4236B}.g-SM{color:var(--accent)}.g-MX{color:var(--good)}
:root[data-theme="dark"] .g-SW{color:#F07AB4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .g-SW{color:#F07AB4}}
.gtag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
.ev-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.ev-head .pl{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase}
/* Comparateur : une couleur par athlète, lisible dans les deux thèmes */
:root{--s1:#1D5A8C;--s2:#C2185B;--s3:#2E7D32;--s4:#D9822B;--s5:#6A4C93}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#7DB4E3;--s2:#F06292;--s3:#66BB6A;--s4:#FFB74D;--s5:#B39DDB}}
:root[data-theme="dark"]{--s1:#7DB4E3;--s2:#F06292;--s3:#66BB6A;--s4:#FFB74D;--s5:#B39DDB}
.picker{display:flex;flex-direction:column;gap:10px}
.pchip{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-weight:600}
.pchip i,.cmp-h i,.legend i,i.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.pchip button{all:unset;cursor:pointer;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;color:var(--muted);font-size:18px;line-height:1}
.pchip button:hover,.pchip button:focus-visible{background:var(--line-soft);color:var(--ink)}
select{max-width:100%;text-overflow:ellipsis}
#cmp-race{flex:1 1 280px;min-width:0}
.pick-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.pick-search{position:relative;flex:1 1 260px;max-width:440px}
.browse .controls input[type=search]{flex:1 1 200px}
.blist{max-height:min(420px,60vh);overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:4px}
.brow{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 10px;border-radius:4px;cursor:pointer}
.brow:hover{background:var(--line-soft)}
.brow.on{background:var(--accent-soft)}
.brow input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;margin:0}
.brow input:disabled{cursor:not-allowed}
.brow input:disabled~.nm{color:var(--muted)}
.brow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:600px){.brow{grid-template-columns:22px minmax(0,1fr) auto}.brow .sub{display:none}}
.pick-search input{width:100%}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:15;overflow:hidden}
.sugg button{all:unset;box-sizing:border-box;display:flex;gap:8px;align-items:center;width:100%;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line-soft)}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button:focus-visible{background:var(--accent-soft)}
.sugg .sub{margin-left:auto}
table.cmp th[scope=row]{font-size:14px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink);white-space:normal;min-width:150px;border-bottom:1px solid var(--line-soft)}
table.cmp th[scope=row]{position:sticky;left:0;background:var(--paper);z-index:1}
table.cmp tbody tr:hover th[scope=row]{background:var(--accent-soft)}
table.cmp tr.grp th{background:var(--snow);color:var(--muted);padding-top:14px}
table.cmp .cmp-h{white-space:nowrap;min-width:92px}
table.cmp .cmp-h a{color:var(--ink);font-size:13px;letter-spacing:.04em;margin-left:6px}
table.cmp td.best{background:var(--accent-soft);font-weight:700;color:var(--ink)}
table.cmp td{white-space:nowrap}
.mchart{position:relative;border-radius:6px;touch-action:pan-y}
.mchart svg{cursor:crosshair}
.mchart:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.mchart .guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.ctip{position:absolute;top:6px;z-index:5;min-width:170px;max-width:260px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:8px 10px;font-size:13px;pointer-events:none}
.ctip>b{display:block;font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.ctip .tr{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:2px 0}
.ctip .tr i{width:10px;height:10px;border-radius:50%}
.ctip .tr b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px}
.cmp-charts>div{min-width:0}
.cmp-charts h3{margin-bottom:8px}
.cmp-charts .chart text{font-size:12px}
@media (max-width:600px){.cmp-charts .chart text{font-size:19px}}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.duel{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.duel b{font-family:var(--display);font-size:40px;line-height:1;display:block}
.duel span{font-size:12px;color:var(--muted)}
.duel>div:last-child{text-align:right}
.duel-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line-soft)}
.duel-bar i{display:block;height:100%}
@media (max-width:600px){.duel b{font-size:30px}.duel{gap:10px}}
.pick-td{width:34px;padding-right:0}
.pick-td input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
tr.picked td{background:var(--accent-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cmpbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:var(--band);color:var(--band-ink);border-radius:10px;padding:10px 12px 10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:max-content;max-width:calc(100% - 32px);font-size:14px}
.cmpbar .btn.ghost{color:var(--band-ink);border-color:var(--band-muted)}
.cmpbar .btn:not(.ghost){background:var(--bib);border-color:var(--bib);color:var(--bib-ink)}
a.btn.disabled{opacity:.5}
tr.stage-row td{vertical-align:top}
tr.stage-row .stage{justify-content:flex-end}
.olp{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--snow)}
.olstep{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.steps{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-size:14px;z-index:40}
@media (max-width:600px){.cal-day{grid-template-columns:1fr;gap:2px}.cal-date{padding-top:0}.cal-race{grid-template-columns:48px 1fr}.cal-race .acts{grid-column:2}.next .when{font-size:34px}}

<body>
<header class="band">
  <div class="wrap">
    <a class="brand" href="#/classements" aria-label="Biathlon Datacenter, accueil"><span class="t5" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Biathlon Datacenter</a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/classements" data-tab="classements">Classements</a>
      <a href="#/calendrier" data-tab="calendrier">Calendrier</a>
      <a href="#/nations" data-tab="nations">Nations</a>
      <a href="#/courses" data-tab="courses">Courses</a>
      <a href="#/recherche" data-tab="recherche">Athlètes</a>
      <a href="#/comparer" data-tab="comparer">Comparer</a>
    </nav>
  </div>
</header>
<main class="wrap" id="view" aria-live="polite"></main>
<footer><div class="wrap" id="foot">Données : Datacenter IBU (biathlonresults.com). Site non officiel, sans lien avec l'IBU.</div></footer>

<script>
"use strict";
/* ================================================================ utilitaires */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const m = String(v ?? "").match(/\d+/); return m ? parseInt(m[0], 10) : null; };
const avg = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
const fmt1 = v => v == null ? "—" : (Math.round(v * 10) / 10).toString().replace(".", ",");
const pct = (a, b) => b ? Math.round(1000 * a / b) / 10 : null;
const fmtPct = v => v == null ? "—" : String(v).replace(".", ",") + " %";
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

const LS = {
  get(k, d) { try { const v = localStorage.getItem("bdc:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("bdc:" + k, JSON.stringify(v)); } catch (e) {} }
};

/* ================================================================ données */
let META = null;
const memo = new Map();
class Missing extends Error {}
function data(path, { fresh = false } = {}) {
  if (!fresh && memo.has(path)) return memo.get(path);
  const v = META ? "?v=" + encodeURIComponent(META.generatedAt) + (fresh ? "&t=" + Date.now() : "") : "?t=" + Date.now();
  const p = fetch("data/" + path + v, { cache: fresh || !META ? "no-store" : "default" }).then(async r => {
    if (r.status === 404) throw new Missing(path);
    if (!r.ok) throw new Error("Erreur " + r.status + " sur " + path);
    return r.json();
  });
  memo.set(path, p);
  p.catch(() => memo.delete(path));
  return p;
}
const season = sid => data(`seasons/${sid}.json`);
const cup = cid => data(`cups/${cid}.json`).then(d => d.Rows || []).catch(e => { if (e instanceof Missing) return []; throw e; });
const race = (rid, o) => data(`races/${rid}.json`, o);
const athlete = id => data(`athletes/${id}.json`);
const athletesIndex = () => data("athletes.json");

async function pool(items, n, fn) {
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = i++; try { out[k] = await fn(items[k], k); } catch (e) { out[k] = null; } }
  }));
  return out;
}

/* ================================================================ référentiels */
const IOC = {FRA:"FR",NOR:"NO",GER:"DE",SWE:"SE",ITA:"IT",AUT:"AT",SUI:"CH",FIN:"FI",CZE:"CZ",SLO:"SI",SVK:"SK",POL:"PL",UKR:"UA",BLR:"BY",RUS:"RU",USA:"US",CAN:"CA",EST:"EE",LAT:"LV",LTU:"LT",BUL:"BG",ROU:"RO",KAZ:"KZ",CHN:"CN",JPN:"JP",KOR:"KR",BEL:"BE",NED:"NL",GBR:"GB",IRL:"IE",ESP:"ES",AUS:"AU",CRO:"HR",SRB:"RS",MDA:"MD",GRE:"GR",HUN:"HU",DEN:"DK",ISL:"IS",MGL:"MN",ARG:"AR",CHI:"CL",BRA:"BR",AND:"AD",BIH:"BA",MKD:"MK",MNE:"ME",TUR:"TR",GEO:"GE",ARM:"AM",LIE:"LI",LUX:"LU",NZL:"NZ",RSA:"ZA",IND:"IN",THA:"TH",UZB:"UZ",KGZ:"KG",POR:"PT",MEX:"MX",AIN:""};
const NATION = {FRA:"France",NOR:"Norvège",GER:"Allemagne",SWE:"Suède",ITA:"Italie",AUT:"Autriche",SUI:"Suisse",FIN:"Finlande",CZE:"Tchéquie",SLO:"Slovénie",SVK:"Slovaquie",POL:"Pologne",UKR:"Ukraine",BLR:"Biélorussie",RUS:"Russie",USA:"États-Unis",CAN:"Canada",EST:"Estonie",LAT:"Lettonie",LTU:"Lituanie",BUL:"Bulgarie",ROU:"Roumanie",KAZ:"Kazakhstan",CHN:"Chine",JPN:"Japon",KOR:"Corée du Sud",BEL:"Belgique",NED:"Pays-Bas",GBR:"Grande-Bretagne",IRL:"Irlande",ESP:"Espagne",AUS:"Australie",CRO:"Croatie",SRB:"Serbie",MDA:"Moldavie",GRE:"Grèce",HUN:"Hongrie",DEN:"Danemark",MGL:"Mongolie",ARG:"Argentine",CHI:"Chili",BRA:"Brésil",AND:"Andorre",BIH:"Bosnie-Herzégovine",TUR:"Turquie",GEO:"Géorgie",LIE:"Liechtenstein",NZL:"Nouvelle-Zélande",AIN:"Athlètes neutres"};
const flag = ioc => { const iso = IOC[ioc]; return iso ? String.fromCodePoint(...[...iso].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : ""; };
const natHTML = ioc => ioc ? `<span class="nat"><span class="flag" aria-hidden="true">${flag(ioc)}</span>${esc(ioc)}</span>` : "";
const natName = ioc => NATION[ioc] || ioc;

const DISC = {SP:"Sprint",PU:"Poursuite",MS:"Mass start",IN:"Individuel",SI:"Individuel court",RL:"Relais",SR:"Relais simple mixte",SS:"Super sprint",MR:"Relais mixte",TS:"Général"};
const CUPTYPE = {TS:"Général",SP:"Sprint",PU:"Poursuite",IN:"Individuel",MS:"Mass start",NC:"Coupe des nations",RL:"Relais",MX:"Relais mixtes"};
const CUPORDER = ["TS","SP","PU","IN","MS","RL","NC","MX"];
const LEVEL = {WC:"Coupe du monde",WCH:"Mondiaux",OWG:"Jeux olympiques","IBU C.":"IBU Cup",IBU:"IBU Cup",ECH:"Championnats d'Europe",JWCH:"Mondiaux juniors",YWCH:"Mondiaux jeunes",JC:"Junior Cup",JECH:"Europe juniors",SWCH:"Mondiaux d'été"};
const levelName = l => LEVEL[l] || (/^SB/.test(l || "") ? "Biathlon d'été" : (/REG/.test(l || "") ? "Course régionale" : (l || "")));
const TOP = new Set(["WC","WCH","OWG"]);
const TEAM = new Set(["RL","SR","MR"]);

const seasonLabel = id => id && /^\d{4}$/.test(id) ? `${+id.slice(0,2) > 50 ? "19" : "20"}${id.slice(0,2)}/${id.slice(2)}` : (id || "");
const seasonFromYear = y => /^\d\d\/\d\d$/.test(y || "") ? y.replace("/", "") : null;

/* Tir */
function positionsFor(code, n, sp) {
  if (sp && sp.length === n && /^[PS]+$/.test(sp)) return sp.split("");
  if (n === 2) return ["P","S"];
  if (n === 4) return (code === "IN" || code === "SI") ? ["P","S","P","S"] : ["P","P","S","S"];
  return Array(n).fill("?");
}
function parseShots(s, code, sp) {
  const str = String(s ?? "").trim();
  if (!/^\d+(\+\d+)+$/.test(str)) return null;
  const misses = str.split("+").map(Number);
  const pos = positionsFor(code, misses.length, sp);
  return misses.map((m, i) => ({ m, p: pos[i] }));
}
function targetsHTML(s, code, sp) {
  const st = parseShots(s, code, sp);
  if (!st) return s ? `<span class="sh-raw">${esc(s)}</span>` : "";
  const lab = {P:"couché",S:"debout","?":"passage"};
  return `<span class="targets" title="${esc(s)}">` + st.map(x => {
    const m = Math.min(5, x.m);
    return `<span class="stage" role="img" aria-label="${lab[x.p]} : ${m} faute${m > 1 ? "s" : ""}">` + '<i class="tg h"></i>'.repeat(5 - m) + '<i class="tg m"></i>'.repeat(m) + "</span>";
  }).join("") + `<span class="sh-raw">${esc(s)}</span></span>`;
}

const fmtDate = s => { if (!s) return ""; const d = new Date(s); return isNaN(d) ? "" : d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }); };
const fmtDateLong = s => { if (!s) return ""; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }); };
const fmtDateTime = s => { if (!s) return ""; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleString("fr-FR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
function ago(s) {
  const d = new Date(s); if (isNaN(d)) return "";
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "à l'instant"; if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60); if (h < 36) return `il y a ${h} h`;
  return "le " + fmtDateLong(s);
}

const loadingHTML = (t = "Chargement") => `<div class="loading"><span class="t5" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>${esc(t)}…</div>`;
const errorHTML = e => e instanceof Missing
  ? `<div class="note">Ces données ne sont pas archivées sur ce site. Elles sont consultables sur <a href="https://www.biathlonresults.com/" target="_blank" rel="noopener">biathlonresults.com</a>.</div>`
  : `<div class="err"><b>Les données n'ont pas pu être chargées.</b><div class="small muted" style="margin-top:4px">${esc(e && e.message || e)}</div><div class="small" style="margin-top:6px">Vérifiez votre connexion puis rechargez la page.</div></div>`;
const medal = rk => rk === 1 ? '<span class="med g">1</span>' : rk === 2 ? '<span class="med s">2</span>' : rk === 3 ? '<span class="med b">3</span>' : "";
const rkCell = (rk, raw) => medal(rk) || esc(rk ?? raw ?? "");
const medalTd = v => { const n = num(v); return `<td class="num mono${n && n <= 3 ? " medal-" + n : ""}">${v ? esc(n ?? v) : '<span class="muted">·</span>'}</td>`; };

/* ================================================================ état */
const state = {
  season: LS.get("season", null),
  gender: LS.get("gender", "SW"),
  cupType: LS.get("cupType", "TS"),
  note: ""
};
const setSeason = s => { state.season = s; LS.set("season", s); };
const setGender = g => { state.gender = g; LS.set("gender", g); };
const seasonIds = () => META.seasons.map(s => s.SeasonId);

async function boot() {
  META = await data("meta.json", { fresh: true });
  const ids = seasonIds();
  if (!state.season || !ids.includes(state.season)) {
    state.season = META.currentSeason && ids.includes(META.currentSeason) ? META.currentSeason : ids[0];
    try {
      const rows = await cup(`BT${state.season}SWRLCP__SWTS`);
      if (!rows.length && META.currentResultsSeason && META.currentResultsSeason !== state.season && ids.includes(META.currentResultsSeason)) {
        state.note = `La saison ${seasonLabel(state.season)} n'a pas encore de classement : affichage de ${seasonLabel(META.currentResultsSeason)}.`;
        state.season = META.currentResultsSeason;
      }
    } catch (e) {}
  }
  const old = Date.now() - new Date(META.generatedAt) > 26 * 3600e3;
  $("#foot").innerHTML = `<span class="fresh${old ? " old" : ""}"><i aria-hidden="true"></i>Données IBU mises à jour ${esc(ago(META.generatedAt))}</span> · ${META.athletes} athlètes, ${META.seasons.length} saisons. Source : Datacenter IBU (biathlonresults.com). Site non officiel, sans lien avec l'IBU.`;
}

function seasonSelect() {
  return `<select id="season-sel" aria-label="Saison">${seasonIds().map(s => `<option value="${s}"${s === state.season ? " selected" : ""}>${seasonLabel(s)}</option>`).join("")}</select>`;
}
function genderSeg() {
  return `<div class="seg" role="group" aria-label="Catégorie"><button data-g="SW" class="${state.gender === "SW" ? "on" : ""}">Femmes</button><button data-g="SM" class="${state.gender === "SM" ? "on" : ""}">Hommes</button></div>`;
}
function bindCommon(root, rerender) {
  const sel = $("#season-sel", root);
  if (sel) sel.addEventListener("change", () => { setSeason(sel.value); rerender(); });
  root.querySelectorAll(".seg [data-g]").forEach(b => b.addEventListener("click", () => { setGender(b.dataset.g); rerender(); }));
}

/* ================================================================ classements */
async function viewStandings(root) {
  const render = () => viewStandings(root);
  root.innerHTML = `<div class="stack">
    <div class="head"><span class="eyebrow">Coupe du monde BMW IBU</span><h1>Classements</h1>
      ${state.note ? `<p class="lede">${esc(state.note)}</p>` : ""}</div>
    <div class="controls">${seasonSelect()}${genderSeg()}</div>
    <div id="cupchips" class="chips"></div><div id="table">${loadingHTML()}</div></div>`;
  bindCommon(root, render);
  try {
    const s = await season(state.season);
    const cups = s.cups || [];
    const typeOf = c => c.CupId.slice(-4, -2) === "MX" ? "MX" : c.CupId.slice(-2);
    const mine = cups.filter(c => c.CupId.slice(-4, -2) === state.gender || c.CupId.slice(-4, -2) === "MX");
    const types = [...new Set(mine.map(typeOf))].sort((a, b) => (CUPORDER.indexOf(a) + 99) % 99 - (CUPORDER.indexOf(b) + 99) % 99);
    if (!types.length) { $("#table", root).innerHTML = `<div class="note">Aucun classement publié pour ${seasonLabel(state.season)}.</div>`; return; }
    if (!types.includes(state.cupType)) state.cupType = types[0];
    $("#cupchips", root).innerHTML = types.map(t => `<button class="chip${t === state.cupType ? " on" : ""}" data-t="${t}">${esc(CUPTYPE[t] || t)}</button>`).join("");
    root.querySelectorAll("#cupchips .chip").forEach(b => b.addEventListener("click", () => { state.cupType = b.dataset.t; LS.set("cupType", b.dataset.t); render(); }));
    const c = mine.find(x => typeOf(x) === state.cupType);
    const full = await data(`cups/${c.CupId}.json`).catch(() => ({ Rows: [] }));
    const rows = full.Rows || [];
    if (!rows.length) { $("#table", root).innerHTML = `<div class="note">Ce classement est vide pour l'instant.</div>`; return; }
    const lead = num(rows[0].Score) || 0;
    const isTeam = !rows.some(r => r.IBUId && r.IBUId.length > 8);
    const bibCls = state.cupType === "TS" ? "y" : "r";
    const cat = state.cupType === "MX" ? "Mixte" : state.gender === "SW" ? "Femmes" : "Hommes";
    const progress = full.RaceCount && full.TotalRaces ? `${full.RaceCount}/${full.TotalRaces} courses` : "";
    $("#table", root).innerHTML = `<section class="panel">
      <div class="ph"><h2>${esc(CUPTYPE[state.cupType] || c.Description)} · ${cat}</h2><span class="muted small">${seasonLabel(state.season)}${progress ? " · " + progress : ""} · ${rows.length} classé${rows.length > 1 ? "s" : ""}</span></div>
      <div class="scroll"><table><thead><tr><th>Rang</th><th>${isTeam ? "Nation" : "Athlète"}</th><th class="hide-sm">Nation</th><th class="num">Points</th><th class="num">Écart</th></tr></thead><tbody>
      ${rows.map((r, i) => { const rk = num(r.Rank), sc = num(r.Score);
        const name = !isTeam ? `<a class="nm" href="#/athlete/${esc(r.IBUId)}">${esc(r.Name || r.ShortName)}</a>` : `<a class="nm" href="#/nation/${esc(r.Nat)}">${esc(natName(r.Nat) || r.Name)}</a>`;
        return `<tr><td class="rk">${esc(rk ?? r.Rank ?? "")}</td><td>${name}${rk === 1 && !isTeam ? `<span class="bib ${bibCls}">Dossard ${bibCls === "y" ? "jaune" : "rouge"}</span>` : ""}<div class="show-sm">${natHTML(r.Nat)}</div></td><td class="hide-sm">${natHTML(r.Nat)}</td><td class="num mono">${esc(r.Score ?? "")}</td><td class="num mono muted">${i === 0 || sc == null ? "" : "−" + (lead - sc)}</td></tr>`; }).join("")}
      </tbody></table></div></section>`;
  } catch (e) { $("#table", root).innerHTML = errorHTML(e); }
}

/* ================================================================ nations */
async function nationTable(sid) {
  const [s, w, m] = await Promise.all([season(sid), cup(`BT${sid}SWRLCP__SWTS`), cup(`BT${sid}SWRLCP__SMTS`)]);
  const by = {};
  const get = n => by[n] || (by[n] = { nat: n, w: 0, m: 0, pts: 0, best: null });
  Object.entries(s.starters || {}).forEach(([id, st]) => { if (!st.nat) return; const o = get(st.nat); st.g === "SW" ? o.w++ : o.m++; });
  const pts = (rows) => rows.forEach(r => { if (!r.Nat) return; const o = get(r.Nat); o.pts += num(r.Score) || 0; const rk = num(r.Rank);
    if (rk != null && (!o.best || rk < o.best.rk)) o.best = { rk, name: r.Name, id: r.IBUId }; });
  pts(w); pts(m);
  return { list: Object.values(by).sort((a, b) => b.pts - a.pts || (b.w + b.m) - (a.w + a.m)), s, w, m };
}
async function viewNations(root) {
  const render = () => viewNations(root);
  root.innerHTML = `<div class="stack"><div class="head"><span class="eyebrow">Coupe du monde</span><h1>Nations</h1>
    <p class="lede">Points des athlètes de chaque pays au classement général et nombre d'athlètes engagés en courses individuelles. Touchez une nation pour voir ses athlètes.</p></div>
    <div class="controls">${seasonSelect()}</div><div id="out">${loadingHTML()}</div></div>`;
  bindCommon(root, render);
  try {
    const { list } = await nationTable(state.season);
    if (!list.length) { $("#out", root).innerHTML = `<div class="note">Pas encore de course disputée en ${seasonLabel(state.season)}.</div>`; return; }
    const max = list[0].pts || 1;
    $("#out", root).innerHTML = `<section class="panel"><div class="scroll"><table><thead><tr><th>#</th><th>Nation</th><th class="num">Femmes</th><th class="num">Hommes</th><th>Points</th><th class="hide-sm">Meilleur classement</th></tr></thead><tbody>
      ${list.map((o, i) => `<tr><td class="rk">${i + 1}</td><td><a class="nm" href="#/nation/${esc(o.nat)}"><span class="flag" aria-hidden="true">${flag(o.nat)}</span> ${esc(natName(o.nat))}</a></td>
        <td class="num mono">${o.w || ""}</td><td class="num mono">${o.m || ""}</td>
        <td><div class="split"><div class="bar"><i style="width:${(100 * o.pts / max).toFixed(1)}%"></i></div><span class="mono">${o.pts}</span></div></td>
        <td class="hide-sm">${o.best ? `${o.best.rk}<sup>e</sup> · <a href="#/athlete/${esc(o.best.id)}">${esc(o.best.name)}</a>` : ""}</td></tr>`).join("")}
      </tbody></table></div></section>`;
  } catch (e) { $("#out", root).innerHTML = errorHTML(e); }
}
async function viewNation(root, nat) {
  const render = () => viewNation(root, nat);
  root.innerHTML = `<div class="stack"><div class="head"><span class="eyebrow"><a href="#/nations">Nations</a> · Coupe du monde</span>
    <h1><span aria-hidden="true">${flag(nat)}</span> ${esc(natName(nat))}</h1></div>
    <div class="controls">${seasonSelect()}</div><div id="out">${loadingHTML()}</div></div>`;
  bindCommon(root, render);
  try {
    const { s, w, m } = await nationTable(state.season);
    const build = (g, rows) => {
      const list = new Map();
      rows.filter(r => r.Nat === nat && r.IBUId).forEach(r => list.set(r.IBUId, { id: r.IBUId, name: r.Name, rk: num(r.Rank), pts: num(r.Score) }));
      Object.entries(s.starters || {}).forEach(([id, st]) => { if (st.nat !== nat || st.g !== g) return;

/* ---------- infobulles des graphiques (souris, toucher, clavier) ---------- */
const CHARTS = new Map(); let chartSeq = 0;
const SVGNS = "http://www.w3.org/2000/svg";
/* spec : { W, T, B, H, xs: [x en unités viewBox], title(i), rows(i) -> [{ color, name, value, cx?, cy? }], label } */
function registerChart(spec) { const id = "c" + (++chartSeq); CHARTS.set(id, spec); return id; }
function bindChart(wrap) {
  const spec = CHARTS.get(wrap.dataset.chart); const svg = wrap.querySelector("svg");
  if (!spec || !svg || wrap.dataset.bound) return; wrap.dataset.bound = "1";
  const guide = document.createElementNS(SVGNS, "line");
  guide.setAttribute("y1", spec.T); guide.setAttribute("y2", spec.H - spec.B); guide.setAttribute("class", "guide"); guide.style.display = "none";
  const dots = document.createElementNS(SVGNS, "g"); dots.setAttribute("class", "hdots");
  svg.appendChild(guide); svg.appendChild(dots);
  const tip = document.createElement("div"); tip.className = "ctip"; tip.hidden = true; tip.setAttribute("role", "status"); wrap.appendChild(tip);
  wrap.tabIndex = 0; wrap.setAttribute("aria-label", (spec.label || "Graphique") + " : survolez ou utilisez les flèches pour lire les valeurs");
  let cur = -1;
  const show = i => {
    if (i < 0 || i >= spec.xs.length) return; cur = i;
    const gx = spec.xs[i]; guide.setAttribute("x1", gx); guide.setAttribute("x2", gx); guide.style.display = "";
    const rows = spec.rows(i);
    dots.innerHTML = rows.filter(r => r.cy != null).map(r => `<circle cx="${r.cx ?? gx}" cy="${r.cy}" r="6.5" fill="${r.color}" stroke="var(--paper)" stroke-width="2.5"/>`).join("");
    tip.innerHTML = `<b>${esc(spec.title(i))}</b>` + rows.map(r => `<div class="tr"><i style="background:${r.color}"></i><span>${esc(r.name)}</span><b>${esc(r.value)}</b></div>`).join("");
    tip.hidden = false;
    const rect = svg.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
    const px = rect.left - wr.left + gx * rect.width / spec.W;
    const tw = tip.offsetWidth; let left = px + 14;
    if (left + tw > wr.width) left = px - tw - 14;
    tip.style.left = Math.max(0, Math.min(left, wr.width - tw)) + "px";
  };
  const hide = () => { cur = -1; tip.hidden = true; guide.style.display = "none"; dots.innerHTML = ""; };
  const nearest = clientX => {
    const rect = svg.getBoundingClientRect(); const vx = (clientX - rect.left) * spec.W / rect.width;
    let best = 0; spec.xs.forEach((x, i) => { if (Math.abs(x - vx) < Math.abs(spec.xs[best] - vx)) best = i; }); return best;
  };
  svg.addEventListener("pointermove", e => show(nearest(e.clientX)));
  svg.addEventListener("pointerdown", e => show(nearest(e.clientX)));
  svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hide(); });
  wrap.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); show(cur < 0 ? (e.key === "ArrowRight" ? 0 : spec.xs.length - 1) : Math.max(0, Math.min(spec.xs.length - 1, cur + (e.key === "ArrowRight" ? 1 : -1)))); }
    if (e.key === "Escape") hide();
  });
  wrap.addEventListener("focus", () => { if (cur < 0) show(spec.xs.length - 1); });
  wrap.addEventListener("blur", hide);
  document.addEventListener("pointerdown", e => { if (!wrap.contains(e.target)) hide(); });
}
new MutationObserver(() => document.querySelectorAll(".mchart[data-chart]:not([data-bound])").forEach(bindChart))
  .observe(document.getElementById("view"), { childList: true, subtree: true });

function rankChart(points) {
  if (points.length < 2) return "";
  const W = 640, H = 190, L = 34, R = 10, T = 14, B = 26;
  const maxR = Math.min(110, Math.max(30, ...points.map(p => p.rk || 0)));
  const x = i => L + i * (W - L - R) / (points.length - 1);
  const y = r => T + (Math.min(r, maxR) - 1) * (H - T - B) / (maxR - 1);
  const ticks = [1, 10, 20, 30, 40, 60, 80, 100].filter(t => t <= maxR);
  const pts = points.map((p, i) => p.rk ? [x(i), y(p.rk)] : null);
  const path = pts.filter(Boolean).map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const id = registerChart({ W, H, T, B, label: "Classement course par course", xs: points.map((p, i) => x(i)),
    title: i => [points[i].label, points[i].when ? fmtDate(points[i].when) : ""].filter(Boolean).join(" · "),
    rows: i => [{ color: "var(--accent)", name: "Classement", value: points[i].rk ? `${points[i].rk}e${points[i].field ? " sur " + points[i].field : ""}` : (points[i].raw || "non classé"), cy: pts[i] ? pts[i][1] : null },
      ...(points[i].extra || [])] });
  return `<div class="chart mchart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Classement course par course">
    <rect x="${L}" y="${(y(1) - 4).toFixed(1)}" width="${W - L - R}" height="${(y(10) - y(1) + 8).toFixed(1)}" fill="var(--accent-soft)"/>
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${(y(t) + 3).toFixed(1)}" text-anchor="end">${t}</text>`).join("")}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
    ${pts.map((p, i) => p ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${points[i].rk <= 3 ? 4.5 : 3}" fill="${points[i].rk === 1 ? "var(--gold)" : points[i].rk <= 3 ? "var(--ink)" : "var(--paper)"}" stroke="var(--accent)" stroke-width="1.5"/>` : "").join("")}
    ${points.map((p, i) => (points.length <= 14 || i % 2 === 0) ? `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(p.short)}</text>` : "").join("")}
  </svg></div>`;
}

async function viewAthlete(root, id) {

/* ================================================================ comparateur */
const MAX_CMP = 5;
const seasonSortKey = s => (+s.slice(0, 2) > 50 ? 1900 : 2000) + +s.slice(0, 2);
const pctNum = v => { const m = String(v ?? "").match(/-?\d+(?:[.,]\d+)?/); return m ? parseFloat(m[0].replace(",", ".")) : null; };

/* Tout ce qu'on sait comparer d'un athlète, à partir de sa fiche */
function athleteProfile(doc) {
  const bio = doc.bio || {}, id = doc.IBUId;
  const res = (doc.results || []).map(r => {
    const code = (r.RaceId || "").slice(-2);
    return { ...r, rk: num(r.Rank), code, team: TEAM.has(code) || (r.Shootings == null && /RL|SR/.test(r.Comp || "")),
      sid: seasonFromYear(r.Season) || (/^BT\d{4}/.test(r.RaceId || "") ? r.RaceId.slice(2, 6) : "") };
  });
  const ind = res.filter(r => TOP.has(r.Level) && !r.team);
  const P = bio.Podiums || {}; const v = k => P[k] || 0;
  const wc = new Map((bio.WC || []).map(w => [w.SeasonId || seasonFromYear(w.Year), w]));
  const statIdx = new Map((bio.StatSeasons || []).map((y, i) => [seasonFromYear(y), i]));
  const shootAgg = list => { let pS = 0, pM = 0, sS = 0, sM = 0;
    list.forEach(r => (parseShots(r.Shootings, r.Comp) || []).forEach(x => { if (x.p === "P") { pS += 5; pM += x.m; } else if (x.p === "S") { sS += 5; sM += x.m; } }));
    return { all: pct(pS + sS - pM - sM, pS + sS), prone: pct(pS - pM, pS), stand: pct(sS - sM, sS), shots: pS + sS }; };
  const perSeason = sid => {
    const rs = ind.filter(r => r.sid === sid), f = rs.filter(r => r.rk != null), w = wc.get(sid) || {}, i = statIdx.get(sid);
    const at = arr => i == null || !arr ? null : arr[i];
    const sh = shootAgg(rs);
    return { starts: rs.length, wins: f.filter(r => r.rk === 1).length, pods: f.filter(r => r.rk <= 3).length, t10: f.filter(r => r.rk <= 10).length,
      avg: avg(f.map(r => r.rk)), best: f.length ? Math.min(...f.map(r => r.rk)) : null,
      tot: num(w.Tot), pts: num(w.Tot_Score), spr: num(w.Spr), pur: num(w.Pur), indv: num(w.Ind), mas: num(w.Mas),
      shAll: pctNum(at(bio.StatShooting)) ?? sh.all, shPr: pctNum(at(bio.StatShootingProne)) ?? sh.prone, shSt: pctNum(at(bio.StatShootingStanding)) ?? sh.stand,
      official: i != null, ski: pctNum(at(bio.StatSkiing)), kmb: pctNum(at(bio.StatSkiKMB)) };
  };
  const seasons = [...new Set([...wc.keys(), ...ind.map(r => r.sid)].filter(Boolean))].sort((a, b) => seasonSortKey(a) - seasonSortKey(b));
  const totals = [...wc.values()].map(w => num(w.Tot)).filter(x => x != null);
  const career = shootAgg(ind);
  return {
    id, bio, res, ind, seasons, perSeason,
    name: bio.FullName || [bio.GivenName, bio.FamilyName].filter(Boolean).join(" ") || id,
    short: bio.FamilyName ? bio.FamilyName.charAt(0) + bio.FamilyName.slice(1).toLowerCase() : (bio.FullName || id),
    nat: bio.NAT || (/^BT[A-Z]{3}/.test(id) ? id.slice(2, 5) : ""),
    age: bio.Age ?? null,
    wcStarts: num(((bio.Stats || []).find(s => s.Description === "WC Starts") || {}).Value),
    career: { indWins: v("ALL_I_P_G"), wcWins: v("WC_I_P_G"), indPods: v("ALL_I_P"), relayWins: v("ALL_T_P_G"),
      owg: [v("OWG_O_P_G"), v("OWG_O_P_S"), v("OWG_O_P_B")], wch: [v("WCH_O_P_G"), v("WCH_O_P_S"), v("WCH_O_P_B")],
      globes: totals.filter(t => t === 1).length, bestTot: totals.length ? Math.min(...totals) : null, seasonsWc: totals.length,
      starts: ind.length, avg: avg(ind.filter(r => r.rk != null).map(r => r.rk)), shAll: career.all, shPr: career.prone, shSt: career.stand }
  };
}

/* Graphique multi-séries, une couleur par athlète */
function multiChart({ xs, series, invert = false, yMin, yMax, unit = "", label, fmt, xLabel = s => seasonLabel(s).slice(2), tipTitle = s => "Saison " + seasonLabel(s), tickFmt }) {
  const W = 680, H = 230, L = tickFmt ? 72 : 46, R = 14, T = 14, B = 30;
  const vals = series.flatMap(s => s.values.filter(x => x != null));
  if (!vals.length || xs.length < 2) return `<p class="small muted">Pas assez de saisons pour tracer ce graphique.</p>`;
  let lo = yMin ?? Math.min(...vals), hi = yMax ?? Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  const x = i => L + i * (W - L - R) / (xs.length - 1);
  const y = vv => invert ? T + (vv - lo) * (H - T - B) / (hi - lo) : H - B - (vv - lo) * (H - T - B) / (hi - lo);
  const step = (() => { const span = hi - lo, raw = span / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 5, 10].map(k => k * p).find(k => span / k <= 5) || raw; })();
  const ticks = []; for (let t = Math.ceil(lo / step) * step; t <= hi + 1e-9; t += step) ticks.push(+t.toFixed(6));
  if (invert && !ticks.includes(1) && lo <= 1) ticks.unshift(1);
  const every = Math.ceil(xs.length / 10);
  const show = fmt || (vv => String(Math.round(vv * 10) / 10).replace(".", ",") + unit);
  const id = registerChart({ W, H, T, B, label, xs: xs.map((s, i) => x(i)), title: i => tipTitle(xs[i], i),
    rows: i => series.map((s, k) => ({ k, s, vv: s.values[i] }))
      .sort((a, b) => a.vv == null ? 1 : b.vv == null ? -1 : (invert ? a.vv - b.vv : b.vv - a.vv))
      .map(({ k, s, vv }) => ({ color: `var(--s${k + 1})`, name: s.name, value: vv == null ? "—" : show(vv, k, i), cy: vv == null ? null : y(vv) })) });
  return `<div class="chart mchart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${(y(t) + 3).toFixed(1)}" text-anchor="end">${tickFmt ? tickFmt(t) : String(t).replace(".", ",") + unit}</text>`).join("")}
    ${xs.map((s, i) => i % every === 0 || i === xs.length - 1 ? `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(xLabel(s, i))}</text>` : "").join("")}
    ${series.map((s, k) => { let d = "", pen = false;
      s.values.forEach((vv, i) => { if (vv == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(vv).toFixed(1); pen = true; });
      return `<path d="${d}" fill="none" stroke="var(--s${k + 1})" stroke-width="2.2" stroke-linejoin="round"/>` +
        s.values.map((vv, i) => vv == null ? "" : `<circle cx="${x(i).toFixed(1)}" cy="${y(vv).toFixed(1)}" r="3.4" fill="var(--paper)" stroke="var(--s${k + 1})" stroke-width="2"/>`).join(""); }).join("")}
  </svg></div>`;
}

  const commonAll = [...rankMaps[0].keys()].filter(rid => rankMaps.every(m => m.has(rid)));
  const archived = new Set(seasonIds());
  const raceOpts = A[0].ind.filter(r => archived.has(r.sid) && A.every(b => b.ind.some(x => x.RaceId === r.RaceId)))

    .sort((a, b) => b.sk - a.sk || a.i - b.i);

  const head = `<tr><th></th>${A.map((a, k) => `<th class="num cmp-h"><i style="background:var(--s${k + 1})" aria-hidden="true"></i><a href="#/athlete/${esc(a.id)}">${esc(a.short)}</a><div class="sub">${flag(a.nat)} ${esc(a.nat)}</div></th>`).join("")}</tr>`;

      ${block("Palmarès", [

      ${block("Statistiques de carrière", [

      <div class="scroll"><table class="cmp"><thead>${head}</thead><tbody>

        ["Sprint", S.map(s => s.spr), f0, -1], ["Poursuite", S.map(s => s.pur), f0, -1], ["Individuel", S.map(s => s.indv), f0, -1], ["Mass start", S.map(s => s.mas), f0, -1]])}

  $("#cmp-season", root).addEventListener("change", e => { LS.set("cmpSeason", e.target.value); refresh(); });

/* ================================================================ comparaison sur une course */
const secs = t => { if (t == null) return null; const str = String(t).replace(/^\+/, "").trim(); if (!/^\d/.test(str)) return null;
  const p = str.split(":").map(Number); return p.some(isNaN) ? null : p.reduce((a, b) => a * 60 + b, 0); };
function fmtSecs(v, signed = false) {
  if (v == null || isNaN(v)) return "—";
  const neg = v < 0; let t = Math.round(Math.abs(v) * 10) / 10;
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = (t % 60).toFixed(1).replace(".", ",");
  const body = h ? `${h}:${String(m).padStart(2, "0")}:${sec.padStart(4, "0")}` : m ? `${m}:${sec.padStart(4, "0")}` : sec + " s";
  return (signed ? (neg ? "−" : "+") : "") + body;
}
const STAGE_FR = { P: "couché", S: "debout", "?": "" };
const ord = v => v === 1 ? "1er" : v + "e";
function penaltyText(code, misses) {
  if (misses == null) return "—";
  if (!misses) return "aucune";
  if (code === "IN") return `${misses} min`;
  if (code === "SI") return `${misses * 45} s`;
  return `${misses} tour${misses > 1 ? "s" : ""}`;
}

async function viewRaceCompare(root, rid, idsStr) {

  const code = rid.slice(-2), sid = /^BT\d{4}/.test(rid) ? rid.slice(2, 6) : "";
  const go = list => { location.hash = list.length >= 2 ? `#/course/${rid}/${list.join(",")}` : `#/course/${rid}`; };
  root.innerHTML = `<div class="stack"><div class="head"><span class="eyebrow"><a href="#/course/${esc(rid)}">← Résultats de la course</a> · ${seasonLabel(sid)}</span>
    <h1 id="rtitle">${esc(DISC[code] || rid)}</h1><p class="lede" id="rsub"></p></div>
    <div class="picker"><div class="chips" id="picked"></div><div class="row" style="display:flex;gap:8px;flex-wrap:wrap" id="adder"></div></div>
    <div id="out">${loadingHTML()}</div></div>`;
  let d, an = null;
  try { [d, an] = await Promise.all([race(rid), data(`analysis/${rid}.json`).catch(() => null)]); } catch (e) { $("#out", root).innerHTML = errorHTML(e); return; }
  const c = d.Competition || {}, ev = d.SportEvt || {};
  $("#rtitle", root).textContent = c.ShortDescription || c.Description || DISC[code] || rid;
  $("#rsub", root).textContent = [ev.ShortDescription || ev.Organizer, fmtDateTime(c.StartTime)].filter(Boolean).join(" · ");
  const rows = (d.Results || []).filter(r => !r.IsTeam && r.IBUId);
  const A = ids.map(id => rows.find(r => r.IBUId === id)).filter(Boolean);
  $("#picked", root).innerHTML = A.map((r, k) => `<span class="pchip"><i style="background:var(--s${k + 1})" aria-hidden="true"></i>${esc(r.Name || r.ShortName)} <span class="nat">${flag(r.Nat)}</span><button type="button" data-rm="${esc(r.IBUId)}" aria-label="Retirer ${esc(r.Name)}">×</button></span>`).join("");
  root.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => go(A.map(r => r.IBUId).filter(x => x !== b.dataset.rm))));
  if (A.length < MAX_CMP) {
    const others = rows.filter(r => !A.includes(r));
    $("#adder", root).innerHTML = `<select id="add-ath" aria-label="Ajouter un athlète de cette course"><option value="">Ajouter un athlète de la course…</option>${others.map(r => `<option value="${esc(r.IBUId)}">${num(r.Rank) ?? esc(r.IRM || "")}${num(r.Rank) ? "e" : ""} · ${esc(r.Name || r.ShortName)} (${esc(r.Nat || "")})</option>`).join("")}</select>`;
    $("#add-ath", root).addEventListener("change", e => { if (e.target.value) go([...A.map(r => r.IBUId), e.target.value]); });
  }
  if (A.length < 2) { $("#out", root).innerHTML = `<div class="note">Choisissez au moins deux athlètes ayant pris part à cette course.</div>`; return; }

  const n = (an && an.shootings) || c.NrShootings || (code === "SP" ? 2 : 4);
  const stages = parseShots(Array(n).fill(0).join("+"), code, c.ShootingPositions) || [];
  const P = A.map(r => {
    const x = (an && an.athletes && an.athletes[r.IBUId]) || {};
    const pair = key => x[key] ? { t: secs(x[key][0]), rk: x[key][1] } : { t: null, rk: null };
    const shots = parseShots(r.Shootings, code, c.ShootingPositions);
    return { r, rk: num(r.Rank), time: secs(r.TotalTime || r.Result), behind: num(r.Rank) === 1 ? 0 : secs(r.Behind),
      shots, misses: shots ? shots.reduce((a, b) => a + b.m, 0) : null, start: code === "PU" && /^\+?\d{1,2}:\d{2}(\.\d)?$|^\+?\d+(\.\d)?$/.test(String(r.StartInfo || "").trim()) ? secs(r.StartInfo) : null,
      ski: pair("c"), range: pair("r"), shoot: pair("s"),
      laps: Array.from({ length: n + 1 }, (_, i) => pair("l" + (i + 1))),
      rng: Array.from({ length: n }, (_, i) => pair("g" + (i + 1))),
      st: Array.from({ length: n }, (_, i) => pair("t" + (i + 1))) };
  });
  const hasAn = P.some(p => p.ski.t != null);
  const field = rows.filter(r => num(r.Rank) != null).length;

  /* Tableau générique : une colonne par athlète, meilleure valeur surlignée */
  const head = `<tr><th></th>${P.map((p, k) => `<th class="num cmp-h"><i style="background:var(--s${k + 1})" aria-hidden="true"></i><a href="#/athlete/${esc(p.r.IBUId)}">${esc(p.r.ShortName || p.r.Name)}</a><div class="sub">${flag(p.r.Nat)} ${esc(p.r.Nat || "")}</div></th>`).join("")}</tr>`;
  const line = (lab, vals, render, dir, note) => {
    const present = vals.filter(v => v != null);
    const best = dir && present.length > 1 && new Set(present).size > 1 ? (dir > 0 ? Math.max(...present) : Math.min(...present)) : null;
    return `<tr><th scope="row">${lab}${note ? `<div class="sub">${note}</div>` : ""}</th>${vals.map((v, k) => `<td class="num mono${best != null && v === best ? " best" : ""}">${render(v, k)}</td>`).join("")}</tr>`;
  };
  const grp = t => `<tr class="grp"><th colspan="${P.length + 1}">${t}</th></tr>`;
  const withRank = (v, rk) => v == null ? "—" : `${fmtSecs(v)}${rk ? `<div class="sub">${ord(rk)}</div>` : ""}`;
  const gap = list => { const present = list.filter(v => v != null); const m = present.length ? Math.min(...present) : null; return list.map(v => v == null || m == null ? null : v - m); };

  let html = `<section class="panel"><div class="ph"><h2>Synthèse</h2><span class="small muted">${field} classés</span></div><div class="scroll"><table class="cmp"><thead>${head}</thead><tbody>
    ${grp("Résultat")}
    ${line("Classement", P.map(p => p.rk), (v, k) => v ? ord(v) : esc(P[k].r.IRM || "—"), -1)}
    ${code === "PU" ? line("Départ de la poursuite", P.map(p => p.start), v => v == null ? "—" : (v ? "+" + fmtSecs(v) : "en tête"), -1, "retard au départ, issu du sprint") : ""}
    ${line("Temps", P.map(p => p.time), v => fmtSecs(v), -1)}
    ${line("Écart au vainqueur", P.map(p => p.behind), v => v == null ? "—" : v ? fmtSecs(v, true) : "vainqueur", -1)}
    ${grp("Tir")}
    ${line("Fautes", P.map(p => p.misses), v => v ?? "—", -1)}
    ${line("Pénalités", P.map(p => p.misses), v => penaltyText(code, v), 0, code === "IN" ? "1 minute par faute" : code === "SI" ? "45 secondes par faute" : "un tour de 150 m par faute")}
    ${hasAn ? line("Temps de tir", P.map(p => p.shoot.t), (v, k) => withRank(v, P[k].shoot.rk), -1, "temps passé à tirer, cumulé") : ""}
    ${hasAn ? line("Temps au pas de tir", P.map(p => p.range.t), (v, k) => withRank(v, P[k].range.rk), -1, "de l'entrée à la sortie du pas de tir") : ""}
    ${hasAn ? grp("Ski") + line("Temps de ski", P.map(p => p.ski.t), (v, k) => withRank(v, P[k].ski.rk), -1, "hors pas de tir et tours de pénalité") : ""}
    ${hasAn ? grp("Où se fait l'écart") + line("Sur les skis", gap(P.map(p => p.ski.t)), v => v == null ? "—" : v ? fmtSecs(v, true) : "meilleur", -1, "par rapport au meilleur du groupe")
      + line("Au pas de tir", gap(P.map(p => p.range.t)), v => v == null ? "—" : v ? fmtSecs(v, true) : "meilleur", -1) + line("En fautes", gap(P.map(p => p.misses)), v => v == null ? "—" : v ? `+${v} (${penaltyText(code, v)})` : "meilleur", -1) : ""}
    </tbody></table></div></section>`;

  if (hasAn) {
    const order = [];
    for (let i = 0; i <= n; i++) { order.push({ lap: i }); if (i < n) order.push({ stage: i }); }
    html += `<section class="panel"><div class="ph"><h2>Tour par tour</h2><span class="small muted">Temps et rang parmi tous les partants</span></div><div class="scroll"><table class="cmp"><thead>${head}</thead><tbody>
      ${order.map(o => o.lap != null
        ? line(`Tour ${o.lap + 1}`, P.map(p => p.laps[o.lap].t), (v, k) => withRank(v, P[k].laps[o.lap].rk), -1, "ski")
        : `<tr class="stage-row"><th scope="row">Tir ${o.stage + 1}<div class="sub">${STAGE_FR[(stages[o.stage] || {}).p] || ""}</div></th>${P.map(p => {
            const m = p.shots && p.shots[o.stage] ? p.shots[o.stage].m : null;
            return `<td class="num"><div>${m == null ? "—" : '<span class="stage">' + '<i class="tg h"></i>'.repeat(5 - Math.min(5, m)) + '<i class="tg m"></i>'.repeat(Math.min(5, m)) + "</span>"}</div>
              <div class="sub mono">${p.st[o.stage].t != null ? `tir ${fmtSecs(p.st[o.stage].t)}` : ""}${p.rng[o.stage].t != null ? ` · pas ${fmtSecs(p.rng[o.stage].t)}` : ""}</div></td>`; }).join("")}</tr>`).join("")}
      </tbody></table></div></section>`;
    const lapsX = Array.from({ length: n + 1 }, (_, i) => i + 1), stX = Array.from({ length: n }, (_, i) => i + 1);
    const stTitle = s => `Tir ${s}${stages[s - 1] && STAGE_FR[stages[s - 1].p] ? " · " + STAGE_FR[stages[s - 1].p] : ""}`;
    const missTxt = (k, i) => { const m = P[k].shots && P[k].shots[i] ? P[k].shots[i].m : null; return m == null ? "" : ` · ${m} faute${m > 1 ? "s" : ""}`; };
    html += `<section class="panel"><div class="ph"><h2>En graphiques</h2><div class="legend">${P.map((p, k) => `<span><i style="background:var(--s${k + 1})"></i>${esc(p.r.ShortName || p.r.Name)}</span>`).join("")}</div></div>
      <div class="pb cmp-charts">
        <div><h3>Temps de ski par tour</h3>${multiChart({ xs: lapsX, label: "Temps de ski par tour", invert: true, xLabel: s => "T" + s, tipTitle: s => "Tour " + s,
          tickFmt: t => fmtSecs(t), fmt: (v, k, i) => `${fmtSecs(v)}${P[k].laps[i].rk ? " · " + ord(P[k].laps[i].rk) : ""}`, series: P.map(p => ({ name: p.r.ShortName || p.r.Name, values: p.laps.map(x => x.t) })) })}</div>
        <div><h3>Temps de tir par passage</h3>${multiChart({ xs: stX, label: "Temps de tir par passage", invert: true, xLabel: s => "Tir " + s, tipTitle: stTitle,
          tickFmt: t => fmtSecs(t), fmt: (v, k, i) => fmtSecs(v) + missTxt(k, i), series: P.map(p => ({ name: p.r.ShortName || p.r.Name, values: p.st.map(x => x.t) })) })}</div>
        <div><h3>Temps au pas de tir</h3>${multiChart({ xs: stX, label: "Temps au pas de tir par passage", invert: true, xLabel: s => "Tir " + s, tipTitle: stTitle,
          tickFmt: t => fmtSecs(t), fmt: (v, k, i) => fmtSecs(v) + missTxt(k, i), series: P.map(p => ({ name: p.r.ShortName || p.r.Name, values: p.rng.map(x => x.t) })) })}</div>
      </div><p class="pb small muted" style="margin:0">Plus le point est haut, plus le temps est court. Survolez ou touchez un graphique pour lire les valeurs.</p></section>`;
  } else {
    html += `<div class="note">Le détail tour par tour (ski, temps de tir, temps au pas de tir) est disponible pour les courses individuelles des cinq dernières saisons. ${META.currentResultsSeason && sid && seasonSortKey(sid) >= seasonSortKey(META.currentResultsSeason) - 4 ? "Il sera ajouté lors d'une prochaine mise à jour des données." : "Cette course est plus ancienne."}</div>`;
  }
  $("#out", root).innerHTML = html;
}

/* ================================================================ calendrier */
const DISC_FR = {SP:"Sprint",PU:"Poursuite",IN:"Individuel",SI:"Individuel court",MS:"Mass start",RL:"Relais",SR:"Relais simple mixte",SS:"Super sprint"};
const DURATION_MIN = {SP:45,PU:45,IN:60,SI:50,MS:45,RL:80,SR:45,SS:30};
const GENDER_FR = {SW:"femmes",SM:"hommes",MX:"mixte"};
const raceCat = r => r.catId || r.RaceId.slice(-4, -2);
const raceDisc = r => r.DisciplineId || r.RaceId.slice(-2);
function raceTitle(r) {
  const d = raceDisc(r);
  let n = DISC_FR[d] || r.ShortDescription || d;
  if (d !== "SR") n += " " + (GENDER_FR[raceCat(r)] || "");
  const km = String(r.km ?? "").trim();
  if (km && km !== "0" && km !== "null" && km !== "undefined") n += " " + km.replace("x", "×").replace(".", ",") + " km";
  return n.trim();
}
const eventKind = eid => /RLOG/.test(eid) ? "JO" : /RLCH/.test(eid) ? "Mondiaux" : "Coupe du monde";
const icsDate = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
const icsEsc = s => String(s ?? "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
function icsFold(line) {
  const enc = new TextEncoder(); if (enc.encode(line).length <= 75) return line;
  const parts = []; let cur = "", len = 0;
  for (const ch of line) { const b = enc.encode(ch).length; if (len + b > (parts.length ? 74 : 75)) { parts.push(cur); cur = ""; len = 0; } cur += ch; len += b; }
  parts.push(cur); return parts.join("\r\n ");
}
function raceUrl(r) { return new URL("#/course/" + r.RaceId, location.href.split("#")[0]).href; }
function icsEvent(r, e, alarm) {
  const start = new Date(r.StartTime); if (isNaN(start)) return [];
  const end = new Date(start.getTime() + (DURATION_MIN[raceDisc(r)] || 60) * 60000);
  const place = e.ShortDescription || e.Organizer || "";
  const loc = [r.Location, place, e.NatLong || e.Nat].filter(Boolean).join(", ");
  const desc = `${eventKind(e.EventId)} de biathlon – ${place}\nRésultats : ${raceUrl(r)}\nDirect officiel : https://www.biathlonresults.com/`;
  const L = ["BEGIN:VEVENT", `UID:${r.RaceId}@biathlon-datacenter`, `DTSTAMP:${icsDate(new Date())}`, `DTSTART:${icsDate(start)}`, `DTEND:${icsDate(end)}`,
    `SUMMARY:${icsEsc(`Biathlon – ${raceTitle(r)} (${place})`)}`, `LOCATION:${icsEsc(loc)}`, `DESCRIPTION:${icsEsc(desc)}`, `URL:${raceUrl(r)}`,
    `CATEGORIES:${icsEsc("Biathlon," + eventKind(e.EventId))}`, "STATUS:CONFIRMED", "TRANSP:TRANSPARENT"];
  if (alarm) L.push("BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:-PT30M", `DESCRIPTION:${icsEsc(raceTitle(r) + " dans 30 minutes")}`, "END:VALARM");
  L.push("END:VEVENT"); return L;
}
function icsDoc(name, items, alarm) {
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Biathlon Datacenter//Calendrier IBU//FR", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", `X-WR-CALNAME:${icsEsc(name)}`];
  items.forEach(({ r, e }) => L.push(...icsEvent(r, e, alarm)));
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n") + "\r\n";
}
function googleLink(r, e) {
  const start = new Date(r.StartTime), end = new Date(start.getTime() + (DURATION_MIN[raceDisc(r)] || 60) * 60000);
  const place = e.ShortDescription || e.Organizer || "";
  const p = new URLSearchParams({ action: "TEMPLATE", text: `Biathlon – ${raceTitle(r)} (${place})`, dates: `${icsDate(start)}/${icsDate(end)}`,
    details: `${eventKind(e.EventId)} de biathlon – ${place}\nRésultats : ${raceUrl(r)}`, location: [r.Location, place, e.NatLong || e.Nat].filter(Boolean).join(", ") });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}
const OUTLOOK_HOST = { live: "https://outlook.live.com", office: "https://outlook.office.com" };
function outlookSubscribe(kind, feedUrl, name) {
  return `${OUTLOOK_HOST[kind]}/calendar/0/addfromweb?` + new URLSearchParams({ url: feedUrl, name }).toString();
}
function outlookEventLink(r, e) {
  const start = new Date(r.StartTime), end = new Date(start.getTime() + (DURATION_MIN[raceDisc(r)] || 60) * 60000);
  const place = e.ShortDescription || e.Organizer || "";
  const p = new URLSearchParams({ path: "/calendar/action/compose", rru: "addevent", subject: `Biathlon – ${raceTitle(r)} (${place})`,
    startdt: start.toISOString().replace(/\.\d{3}Z$/, "Z"), enddt: end.toISOString().replace(/\.\d{3}Z$/, "Z"),
    location: [r.Location, place, e.NatLong || e.Nat].filter(Boolean).join(", "), body: `${eventKind(e.EventId)} de biathlon – ${place}. Résultats : ${raceUrl(r)}` });
  return "https://outlook.live.com/calendar/0/deeplink/compose?" + p.toString();
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
function downloadText(filename, text) {
  const url = URL.createObjectURL(new Blob([text], { type: "text/calendar;charset=utf-8" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); toast("Lien copié"); }
  catch (e) {
    if (el) { const range = document.createRange(); range.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); }
    toast("Le lien est sélectionné : copiez-le");
  }
}
function countdown(d) {
  const ms = d - Date.now(); if (ms <= 0) return ["En cours", ""];
  const days = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60;
  if (days >= 2) return [`J−${days}`, "jours"];
  if (days === 1) return [`${24 + h} h`, "avant le départ"];
  return [h ? `${h} h ${String(m).padStart(2, "0")}` : `${m} min`, "avant le départ"];
}

    if (!seasonItems.length) { toast("Le calendrier est encore en cours de chargement"); return; }
    // Ouvrir Outlook d'abord, dans le geste de l'utilisateur, pour ne pas être bloqué par le navigateur.
    window.open(OUTLOOK_HOST[olKind] + "/calendar/view/month", "_blank", "noopener");
    downloadText(importName, icsDoc(feedName, seasonItems, true));
    toast(`${seasonItems.length} courses téléchargées : importez le fichier dans Outlook`);
  });

  let s;
  try { s = await season(sid); } catch (e) { $("#out", root).innerHTML = errorHTML(e); return; }
  const all = [];
  (s.events || []).forEach(e => (e.races || []).forEach(r => { if (r.StartTime) all.push({ r, e, d: new Date(r.StartTime) }); }));
  all.sort((a, b) => a.d - b.d);
  if (!all.length) { $("#out", root).innerHTML = `<div class="note">Le calendrier ${seasonLabel(sid)} n'est pas encore publié par l'IBU.</div>`; return; }
  seasonItems = all.filter(x => f.g === "all" || raceCat(x.r) === f.g || raceCat(x.r) === "MX");
  seasonCount = String(seasonItems.length);
  const btn = $("#ol-import", root); if (btn) btn.textContent = `Télécharger les ${seasonItems.length} courses et ouvrir Outlook`;
  const p = $("#ol-panel p.small", root); if (p) p.textContent = `Les ${seasonItems.length} courses de la saison arrivent dans votre agenda en une fois, avec un rappel 30 minutes avant chaque départ.`;
  const discs = [...new Set(all.map(x => raceDisc(x.r)))].sort((a, b) => ["SP","PU","IN","SI","MS","RL","SR","SS"].indexOf(a) - ["SP","PU","IN","SI","MS","RL","SR","SS"].indexOf(b));
  const now = Date.now();
  const keep = x => (f.g === "all" || raceCat(x.r) === f.g || raceCat(x.r) === "MX") && (!f.disc.length || f.disc.includes(raceDisc(x.r))) && (!f.hidePast || x.d.getTime() + 2 * 3600e3 > now);
  const list = all.filter(keep);

  $("#filters", root).innerHTML = `<div class="chips" role="group" aria-label="Épreuves">${discs.map(d => `<button class="chip${f.disc.includes(d) ? " on" : ""}" data-d="${d}">${esc(DISC_FR[d] || d)}</button>`).join("")}</div>
    <label class="small"><input type="checkbox" id="hide-past"${f.hidePast ? " checked" : ""}> Masquer les courses passées</label>
    <button class="btn ghost sm" id="dl-sel" type="button"${list.length ? "" : " disabled"}>Télécharger ces ${list.length} courses (.ics)</button>`;
  root.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => {
    const d = b.dataset.d; const disc = f.disc.includes(d) ? f.disc.filter(x => x !== d) : [...f.disc, d]; LS.set("cal", { ...f, disc }); render(); }));
  $("#hide-past", root).addEventListener("change", ev => { LS.set("cal", { ...f, hidePast: ev.target.checked }); render(); });
  $("#dl-sel", root).addEventListener("click", () => {
    downloadText(`biathlon-${sid}-selection.ics`, icsDoc(`Biathlon ${seasonLabel(sid)}`, list, true));
    toast("Fichier téléchargé : ouvrez-le pour ajouter les courses à votre agenda");
  });

  const nx = all.filter(x => (f.g === "all" || raceCat(x.r) === f.g || raceCat(x.r) === "MX") && x.d.getTime() + 2 * 3600e3 > now)[0];
  if (nx) {
    const [big, small] = countdown(nx.d);
    $("#next", root).innerHTML = `<div class="next"><div class="when">${esc(big)}<small>${esc(small)}</small></div>
      <div class="what"><span>Prochaine course</span><b>${esc(raceTitle(nx.r))}</b><span>${esc(nx.e.ShortDescription || "")} · ${esc(fmtDateTime(nx.r.StartTime))}</span></div></div>`;
  }

  if (!list.length) { $("#out", root).innerHTML = `<div class="note">Aucune course ne correspond aux filtres.</div>`; return; }
  const dayKey = d => d.toLocaleDateString("fr-FR", { year: "numeric", month: "2-digit", day: "2-digit" });
  const groups = [];
  list.forEach(x => { let g = groups.find(g => g.e.EventId === x.e.EventId); if (!g) groups.push(g = { e: x.e, days: [] });
    let day = g.days.find(d => d.k === dayKey(x.d)); if (!day) g.days.push(day = { k: dayKey(x.d), d: x.d, items: [] }); day.items.push(x); });
  const icsHref = r => "data/calendar/races/" + encodeURIComponent(r.RaceId) + ".ics";
  $("#out", root).innerHTML = `<div class="events">${groups.map(g => `<section class="ev">
      <div class="ev-head"><span><span class="pl">${esc(g.e.ShortDescription || g.e.Organizer || "")}</span> ${natHTML(g.e.Nat)}${eventKind(g.e.EventId) !== "Coupe du monde" ? ` <span class="tag live">${esc(eventKind(g.e.EventId))}</span>` : ""}</span>
        <span class="small muted">${fmtDate(g.e.StartDate)} – ${fmtDate(g.e.EndDate)}</span></div>
      ${g.days.map(day => `<div class="cal-day"><div class="cal-date">${esc(day.d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric" }))}<small>${esc(day.d.toLocaleDateString("fr-FR", { month: "long" }))}</small></div>
        <div class="cal-races">${day.items.map(x => `<div class="cal-race${x.d.getTime() + 2 * 3600e3 < now ? " past" : ""}">
          <span class="t">${esc(x.d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }))}</span>
          <span class="n"><a href="#/course/${esc(x.r.RaceId)}">${esc(raceTitle(x.r))}</a><span class="gtag g-${raceCat(x.r)}">${esc({ SW: "F", SM: "H", MX: "Mixte" }[raceCat(x.r)] || "")}</span></span>
          <span class="acts"><a class="btn ghost sm" href="${icsHref(x.r)}" aria-label="Ajouter ${esc(raceTitle(x.r))} à mon agenda">Agenda</a><a class="btn ghost sm" href="${esc(outlookEventLink(x.r, x.e))}" target="_blank" rel="noopener" aria-label="Ajouter ${esc(raceTitle(x.r))} à Outlook">Outlook</a><a class="btn ghost sm" href="${esc(googleLink(x.r, x.e))}" target="_blank" rel="noopener" aria-label="Ajouter ${esc(raceTitle(x.r))} à Google Agenda">Google</a></span>
        </div>`).join("")}</div></div>`).join("")}
    </section>`).join("")}</div>
    <p class="small muted">« Agenda » télécharge la course (fichier .ics, rappel 30 minutes avant le départ) pour Apple Calendrier ou tout autre agenda. « Outlook » et « Google » l'ouvrent pré-remplie dans votre agenda en ligne. Durées indicatives.</p>`;
}

/* ================================================================ routeur */
async function route() {
  clearInterval(liveTimer); liveTimer = null; CHARTS.clear();
  const root = $("#view");
  const [page, arg, arg2] = location.hash.replace(/^#\/?/, "").split("/");
  const tab = { comparer: "comparer", calendrier: "calendrier", nations: "nations", nation: "nations", courses: "courses", course: "courses", recherche: "recherche", athlete: "recherche" }[page] || "classements";
  document.querySelectorAll("nav.tabs a").forEach(a => { const on = a.dataset.tab === tab; a.classList.toggle("on", on); on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"); });
  window.scrollTo(0, 0);
  if (!META) {
    root.innerHTML = loadingHTML("Chargement");
    try { await boot(); } catch (e) { root.innerHTML = errorHTML(e instanceof Missing ? new Error("Les données ne sont pas encore générées. Revenez dans quelques minutes.") : e); return; }
  }
  const a = decodeURIComponent(arg || "");
  if (page === "calendrier") return viewCalendar(root);
  if (page === "nations") return viewNations(root);
  if (page === "nation" && a) return viewNation(root, a);
  if (page === "courses") return viewCourses(root);
  if (page === "course" && a && arg2) return viewRaceCompare(root, a, decodeURIComponent(arg2));
  if (page === "course" && a) return viewRace(root, a);
  if (page === "recherche") return viewSearch(root);
  if (page === "athlete" && a) return viewAthlete(root, a);
  if (page === "comparer") return viewCompare(root, a);
  return viewStandings(root);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
